<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Resiliencia Suite | Clínica de Psicología</title>

    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/locales/es.global.min.js'></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* ========================================
           HOJA DE ESTILO: APPLE DESIGN SYSTEM (LIGHT)
           ========================================
        */
        :root {
            --ios-bg: #F2F2F7;
            --ios-card: #FFFFFF;
            --ios-blue: #007AFF;
            --ios-red: #FF3B30;
            --ios-green: #34C759;
            --ios-gray: #8E8E93;
            --ios-light-gray: #C7C7CC;
            --ios-text: #000000;
            --ios-border: #E5E5EA;
            --shadow-soft: 0 4px 12px rgba(0,0,0,0.08);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--ios-bg);
            color: var(--ios-text);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* BARRA SUPERIOR (HEADER) */
        .apple-navbar {
            height: 90px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            border-bottom: 0.5px solid var(--ios-border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-left { display: flex; align-items: center; width: 250px; }
        .logo-main { height: 45px; object-fit: contain; }

        .navbar-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            flex: 1;
        }

        .profile-frame {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid var(--ios-blue);
            padding: 2px;
            background: white;
            margin-bottom: 4px;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .profile-name-tag {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--ios-gray);
            text-transform: uppercase;
        }

        .navbar-right {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 20px;
            width: 250px;
        }

        .btn-icon-nav {
            background: none;
            border: none;
            color: var(--ios-blue);
            font-size: 22px;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-icon-nav:hover { opacity: 0.7; transform: scale(1.1); }

        /* BUSCADOR */
        .search-area {
            background: white;
            padding: 10px 20px;
            border-bottom: 0.5px solid var(--ios-border);
        }

        .search-wrapper {
            background: #E3E3E8;
            border-radius: 12px;
            display: flex;
            align-items: center;
            padding: 8px 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-wrapper i { color: var(--ios-gray); margin-right: 10px; }
        .search-wrapper input {
            border: none;
            background: transparent;
            width: 100%;
            font-size: 16px;
            outline: none;
            color: black;
        }

        /* PESTAÑAS (TABS) */
        .apple-tabs {
            display: flex;
            justify-content: center;
            padding: 15px 0;
            background: white;
            gap: 8px;
        }

        .tab-item {
            padding: 8px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--ios-blue);
            transition: var(--transition);
        }

        .tab-item.active {
            background: var(--ios-blue);
            color: white;
        }

        /* CONTENIDO PRINCIPAL */
        .main-container {
            display: flex;
            padding: 20px;
            gap: 25px;
            max-width: 1600px;
            margin: 0 auto;
            min-height: calc(100vh - 250px);
        }

        /* BARRA LATERAL (ADMIN) */
        .sidebar-admin {
            width: 340px;
            flex-shrink: 0;
            display: none; /* Se activa por JS */
        }

        .card-apple {
            background: var(--ios-card);
            border-radius: 20px;
            padding: 24px;
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--ios-border);
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #1c1c1e;
        }

        /* INPUTS ESTILO APPLE */
        .apple-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--ios-gray);
            text-transform: uppercase;
            margin-bottom: 6px;
            margin-left: 4px;
        }

        .apple-input {
            width: 100%;
            background: #F9F9F9;
            border: 1px solid var(--ios-border);
            padding: 14px;
            border-radius: 14px;
            font-size: 16px;
            margin-bottom: 15px;
            box-sizing: border-box;
            outline: none;
            transition: border 0.2s;
        }

        .apple-input:focus { border-color: var(--ios-blue); }

        .btn-apple {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: none;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-primary { background: var(--ios-blue); color: white; }
        .btn-primary:active { transform: scale(0.98); opacity: 0.9; }
        .btn-ghost { background: transparent; color: var(--ios-blue); }

        /* CALENDARIO */
        .calendar-box {
            flex: 1;
            background: var(--ios-card);
            border-radius: 20px;
            padding: 10px;
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--ios-border);
            min-height: 700px;
        }

        /* CUSTOMIZACIÓN FULLCALENDAR */
        .fc { --fc-border-color: #E5E5EA; --fc-today-bg-color: rgba(0, 122, 255, 0.05); }
        .fc-header-toolbar { display: none !important; }
        .fc-theme-standard .fc-scrollgrid { border: none !important; }
        .fc-day-other { opacity: 0; pointer-events: none; } /* REQUISITO: Ocultar otros meses */
        .fc-col-header-cell { padding: 12px 0 !important; font-weight: 600; color: var(--ios-gray); font-size: 12px; text-transform: uppercase; }
        .fc-daygrid-day-number { font-weight: 400; font-size: 16px; padding: 10px !important; }
        .fc-event { border-radius: 6px; padding: 4px 8px; font-size: 12px; font-weight: 500; border: none !important; }

        /* LISTADO DE PSICÓLOGAS (SIDEBAR) */
        .psico-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: var(--transition);
        }

        .psico-item:hover { background: #f2f2f7; }
        .psico-item.active { background: #E8F2FF; border: 1px solid var(--ios-blue); }

        .psico-color-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 15px;
        }

        .psico-info-text b { display: block; font-size: 14px; }
        .psico-info-text span { font-size: 12px; color: var(--ios-gray); }

        /* MODALES ELEGANTES */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .modal-sheet {
            background: white;
            width: 90%;
            max-width: 450px;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            animation: sheetUp 0.4s ease-out;
        }

        @keyframes sheetUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header { text-align: center; margin-bottom: 25px; }
        .modal-header h2 { margin: 0; font-size: 22px; font-weight: 700; }

        /* FOOTER DE LOGIN O ESTADO */
        #login-screen {
            position: fixed;
            inset: 0;
            background: var(--ios-bg);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* TOAST NOTIFICATION */
        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 14px;
            z-index: 3000;
            display: none;
        }

        @media (max-width: 1024px) {
            .main-container { flex-direction: column; }
            .sidebar-admin { width: 100%; }
        }
    </style>
</head>
<body>

    <div id="toast" class="toast-msg"></div>

    <div id="login-screen">
        <div style="width: 320px; text-align: center;">
            <img src="Resiliencia.png" style="width: 120px; margin-bottom: 30px;">
            <div class="card-apple">
                <h3 style="margin-top:0">Bienvenido</h3>
                <input type="email" id="auth-email" class="apple-input" placeholder="Correo">
                <input type="password" id="auth-pass" class="apple-input" placeholder="Contraseña">
                <button class="btn-apple btn-primary" id="btn-login">Entrar a la Clínica</button>
            </div>
        </div>
    </div>

    <header class="apple-navbar" id="main-nav" style="display:none;">
        <div class="navbar-left">
            <img src="Resiliencia.png" class="logo-main" alt="Logo">
        </div>

        <div class="navbar-center">
            <div class="profile-frame">
                <img id="user-avatar" src="https://via.placeholder.com/150" class="profile-img">
            </div>
            <span id="user-alias" class="profile-name-tag">Cargando...</span>
        </div>

        <div class="navbar-right">
            <button class="btn-icon-nav" onclick="abrirConfig()"><i class="fa-solid fa-gear"></i></button>
            <button class="btn-icon-nav" style="color:var(--ios-red)" id="btn-logout"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
    </header>

    <div class="search-area" id="search-bar-ui" style="display:none;">
        <div class="search-wrapper">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="global-search" placeholder="Buscar paciente por nombre..." oninput="ejecutarBusqueda()">
        </div>
    </div>

    <nav class="apple-tabs" id="tabs-ui" style="display:none;">
        <button class="tab-item active" id="tab-month" onclick="cambiarVista('dayGridMonth', this)">MES</button>
        <button class="tab-item" id="tab-week" onclick="cambiarVista('timeGridWeek', this)">SEMANA</button>
        <button class="tab-item" id="tab-day" onclick="cambiarVista('timeGridDay', this)">DÍA</button>
    </nav>

    <div class="main-container" id="app-content" style="display:none;">
        
        <aside class="sidebar-admin" id="admin-panel">
            <div class="card-apple">
                <div class="card-title">Gestión de Equipo</div>
                <label class="apple-label">Nombre de Psicóloga</label>
                <input type="text" id="new-doc-name" class="apple-input">
                <label class="apple-label">Correo Electrónico</label>
                <input type="email" id="new-doc-email" class="apple-input">
                <button class="btn-apple btn-primary" id="btn-add-psico">Registros</button>
            </div>

            <div class="card-apple">
                <div class="card-title">Reporte Mensual</div>
                <input type="month" id="report-filter" class="apple-input" onchange="actualizarReporteAdmin()">
                <div id="psico-list-container">
                    </div>
                <button id="btn-reset-filter" class="btn-apple btn-ghost" style="display:none; margin-top:10px;" onclick="filtrarPsico(null)">Ver Todos</button>
            </div>
        </aside>

        <div class="calendar-box">
            <div id="calendar"></div>
        </div>
    </div>

    <div id="modal-perfil" class="modal-overlay">
        <div class="modal-sheet">
            <div class="modal-header">
                <h2>Ajustes de Perfil</h2>
            </div>
            <label class="apple-label">Tu Nombre Público</label>
            <input type="text" id="p-name" class="apple-input">
            <label class="apple-label">URL Foto de Perfil</label>
            <input type="text" id="p-photo" class="apple-input">
            <button class="btn-apple btn-primary" onclick="guardarPerfil()">Guardar Cambios</button>
            <button class="btn-apple btn-ghost" onclick="cerrarModales()">Cancelar</button>
        </div>
    </div>

    <div id="modal-cita" class="modal-overlay">
        <div class="modal-sheet">
            <div class="modal-header">
                <h2 id="cita-modal-title">Agendar Sesión</h2>
            </div>
            
            <label class="apple-label">Paciente</label>
            <input type="text" id="c-px" class="apple-input">
            
            <label class="apple-label">WhatsApp</label>
            <div style="display:flex; gap:10px;">
                <select id="c-code" class="apple-input" style="width:120px;">
                    <option value="502">🇬🇹 +502</option>
                    <option value="52">🇲🇽 +52</option>
                    <option value="1">🇺🇸 +1</option>
                    <option value="503">🇸🇻 +503</option>
                    <option value="504">🇭🇳 +504</option>
                </select>
                <input type="number" id="c-tel" class="apple-input">
            </div>

            <label class="apple-label">Notas de la sesión</label>
            <textarea id="c-notas" class="apple-input" rows="3"></textarea>

            <label class="apple-label">Horario</label>
            <input type="datetime-local" id="c-start" class="apple-input">

            <button class="btn-apple btn-primary" id="btn-save-cita">Guardar</button>
            <button class="btn-apple btn-ghost" style="margin-top:10px; border:1px solid var(--ios-border); display:none;" id="btn-wpp-remind">Enviar Recordatorio</button>
            <button class="btn-apple btn-ghost" style="margin-top:20px; color:var(--ios-red)" id="btn-del-cita">Eliminar Permanente</button>
            <button class="btn-apple btn-ghost" onclick="cerrarModales()">Cerrar</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, setDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // CONFIGURACIÓN PROPORCIONADA
        const firebaseConfig = { 
            apiKey: "AIzaSyC-cNJm__gM_e0lijaG7DgYPikXfnuHRZA", 
            authDomain: "agendaresiliencia-12.firebaseapp.com", 
            projectId: "agendaresiliencia-12", 
            storageBucket: "agendaresiliencia-12.firebasestorage.app", 
            appId: "1:1068233469888:web:f958c72f406ac8698da225" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const ADMIN_EMAIL = "resilienciaguate@gmail.com";
        const PALETTE = ["#007AFF", "#34C759", "#FF9500", "#AF52DE", "#FF2D55", "#5856D6", "#FFCC00"];

        let calendar;
        let equipo = [];
        let citas = [];
        let perfiles = {};
        let filtroDoc = null;
        let busquedaTexto = "";
        let idSeleccionado = null;

        // --- MANEJO DE ESTADO DE SESIÓN ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-nav').style.display = 'flex';
                document.getElementById('search-bar-ui').style.display = 'block';
                document.getElementById('tabs-ui').style.display = 'flex';
                document.getElementById('app-content').style.display = 'flex';
                
                if(user.email.toLowerCase() === ADMIN_EMAIL) {
                    document.getElementById('admin-panel').style.display = 'block';
                }

                iniciarFirebase();
            }
        });

        // --- ESCUCHAS DE FIREBASE ---
        function iniciarFirebase() {
            // 1. Perfiles
            onSnapshot(collection(db, "perfiles"), (snap) => {
                snap.forEach(d => perfiles[d.id] = d.data());
                actualizarUIPerfil();
            });

            // 2. Psicólogas
            onSnapshot(collection(db, "psicologas"), (snap) => {
                equipo = snap.docs.map(d => ({id: d.id, ...d.data()}));
                actualizarReporteAdmin();
            });

            // 3. Citas
            onSnapshot(collection(db, "citas"), (snap) => {
                citas = snap.docs.map(d => ({id: d.id, ...d.data()}));
                actualizarCalendario();
            });

            initCalendar();
        }

        function initCalendar() {
            const el = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(el, {
                initialView: 'dayGridMonth',
                locale: 'es',
                firstDay: 1,
                selectable: true,
                showNonCurrentDates: false,
                slotMinTime: '07:00:00',
                slotMaxTime: '19:00:00',
                slotDuration: '01:00:00',
                allDaySlot: false,
                headerToolbar: false,
                eventClick: (info) => abrirModalEditar(info.event.id),
                select: (info) => {
                    // Solo permitir agendar en vistas detalladas
                    if(calendar.view.type !== 'dayGridMonth') {
                        abrirModalNuevo(info.startStr.substring(0,16));
                    }
                }
            });
            calendar.render();
        }

        // --- FUNCIONES DE INTERFAZ (UI) ---
        window.cambiarVista = (tipo, btn) => {
            calendar.changeView(tipo);
            document.querySelectorAll('.tab-item').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        };

        window.ejecutarBusqueda = () => {
            busquedaTexto = document.getElementById('global-search').value.toLowerCase();
            actualizarCalendario();
        };

        function actualizarCalendario() {
            calendar.removeAllEvents();
            let filtradas = citas;

            // Filtro por admin o usuario
            if(auth.currentUser.email.toLowerCase() !== ADMIN_EMAIL) {
                filtradas = filtradas.filter(c => c.userEmail === auth.currentUser.email.toLowerCase());
            } else if(filtroDoc) {
                filtradas = filtradas.filter(c => c.userEmail === filtroDoc);
            }

            // Filtro por buscador
            if(busquedaTexto) {
                filtradas = filtradas.filter(c => c.title.toLowerCase().includes(busquedaTexto));
            }

            filtradas.forEach(c => {
                calendar.addEvent({
                    id: c.id,
                    title: c.title,
                    start: c.start,
                    color: c.color,
                    extendedProps: { ...c }
                });
            });
        }

        function actualizarUIPerfil() {
            const yo = perfiles[auth.currentUser.email.toLowerCase()];
            if(yo) {
                document.getElementById('user-avatar').src = yo.photo || "https://via.placeholder.com/150";
                document.getElementById('user-alias').innerText = yo.displayName || auth.currentUser.email;
            }
        }

        window.actualizarReporteAdmin = () => {
            const mes = document.getElementById('report-filter').value;
            const container = document.getElementById('psico-list-container');
            container.innerHTML = "";

            equipo.forEach(p => {
                const total = citas.filter(c => c.userEmail === p.email && c.start.startsWith(mes)).length;
                const div = document.createElement('div');
                div.className = `psico-item ${filtroDoc === p.email ? 'active' : ''}`;
                div.onclick = () => filtrarPsico(p.email);
                div.innerHTML = `
                    <div class="psico-color-dot" style="background:${p.color}"></div>
                    <div class="psico-info-text">
                        <b>${p.name}</b>
                        <span>${total} citas este mes</span>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        window.filtrarPsico = (email) => {
            filtroDoc = email;
            document.getElementById('btn-reset-filter').style.display = email ? 'block' : 'none';
            actualizarReporteAdmin();
            actualizarCalendario();
        }

        // --- ACCIONES DE DATOS ---
        document.getElementById('btn-add-psico').onclick = async () => {
            const n = document.getElementById('new-doc-name').value;
            const e = document.getElementById('new-doc-email').value.toLowerCase();
            if(n && e) {
                await addDoc(collection(db, "psicologas"), {
                    name: n, email: e, color: PALETTE[equipo.length % PALETTE.length]
                });
                showToast("Psicóloga registrada");
            }
        };

        window.abrirModalNuevo = (fecha) => {
            idSeleccionado = null;
            document.getElementById('cita-modal-title').innerText = "Agendar Sesión";
            document.getElementById('c-px').value = "";
            document.getElementById('c-tel').value = "";
            document.getElementById('c-notas').value = "";
            document.getElementById('c-start').value = fecha;
            document.getElementById('btn-del-cita').style.display = 'none';
            document.getElementById('btn-wpp-remind').style.display = 'none';
            document.getElementById('modal-cita').style.display = 'flex';
        };

        window.abrirModalEditar = (id) => {
            idSeleccionado = id;
            const c = citas.find(x => x.id === id);
            document.getElementById('cita-modal-title').innerText = "Editar Sesión";
            document.getElementById('c-px').value = c.title;
            document.getElementById('c-tel').value = c.tel || "";
            document.getElementById('c-notas').value = c.notas || "";
            document.getElementById('c-start').value = c.start.substring(0,16);
            document.getElementById('btn-del-cita').style.display = 'block';
            document.getElementById('btn-wpp-remind').style.display = 'block';
            document.getElementById('modal-cita').style.display = 'flex';
        };

        document.getElementById('btn-save-cita').onclick = async () => {
            const userEmail = auth.currentUser.email.toLowerCase();
            const psico = equipo.find(p => p.email === userEmail) || { color: '#007AFF', name: 'Resiliencia' };
            const payload = {
                title: document.getElementById('c-px').value,
                tel: document.getElementById('c-tel').value,
                notas: document.getElementById('c-notas').value,
                start: document.getElementById('c-start').value,
                userEmail: userEmail,
                psicoName: psico.name,
                color: psico.color
            };

            if(idSeleccionado) {
                await updateDoc(doc(db, "citas", idSeleccionado), payload);
            } else {
                await addDoc(collection(db, "citas"), payload);
                enviarWhatsApp(payload, 'confirmacion');
            }
            cerrarModales();
            showToast("Agenda actualizada");
        };

        document.getElementById('btn-del-cita').onclick = async () => {
            if(confirm("¿Eliminar cita permanentemente?")) {
                await deleteDoc(doc(db, "citas", idSeleccionado));
                cerrarModales();
            }
        };

        document.getElementById('btn-wpp-remind').onclick = () => {
            const c = citas.find(x => x.id === idSeleccionado);
            enviarWhatsApp(c, 'recordatorio');
        };

        function enviarWhatsApp(c, tipo) {
            const cod = document.getElementById('c-code').value;
            const fechaTxt = c.start.replace('T', ' a las ');
            let msg = "";
            if(tipo === 'confirmacion') msg = `Hola ${c.title}, tu cita ha sido agendada con la psicóloga ${c.psicoName} para el día ${fechaTxt}.`;
            else msg = `Recordatorio: Hola ${c.title}, te recordamos tu sesión con ${c.psicoName} el día ${fechaTxt}.`;
            
            window.open(`https://wa.me/${cod}${c.tel}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        window.abrirConfig = () => {
            const yo = perfiles[auth.currentUser.email.toLowerCase()] || {};
            document.getElementById('p-name').value = yo.displayName || "";
            document.getElementById('p-photo').value = yo.photo || "";
            document.getElementById('modal-perfil').style.display = 'flex';
        };

        window.guardarPerfil = async () => {
            await setDoc(doc(db, "perfiles", auth.currentUser.email.toLowerCase()), {
                displayName: document.getElementById('p-name').value,
                photo: document.getElementById('p-photo').value
            });
            cerrarModales();
            showToast("Perfil guardado");
        };

        window.cerrarModales = () => {
            document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none');
        };

        function showToast(m) {
            const t = document.getElementById('toast');
            t.innerText = m; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        // LOGIN / LOGOUT
        document.getElementById('btn-login').onclick = () => {
            const e = document.getElementById('auth-email').value;
            const p = document.getElementById('auth-pass').value;
            signInWithEmailAndPassword(auth, e, p).catch(err => alert("Acceso denegado"));
        };

        document.getElementById('btn-logout').onclick = () => signOut(auth).then(() => location.reload());

    </script>
</body>
</html>
