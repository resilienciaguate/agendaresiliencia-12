<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Resiliencia | Suite Premium 2026</title>

    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/locales/es.global.min.js'></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --brand-color: #a5c941; 
            --glass-bg: rgba(255, 255, 255, 0.85);
            --apple-shadow: 0 10px 40px rgba(0,0,0,0.05);
            --text-dark: #1d1d1f;
            --ios-gray: #f2f2f7;
        }

        html, body { min-height: 100%; margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: #ffffff; color: var(--text-dark); overflow-x: hidden; }

        /* REPARACIÓN DEFINITIVA LOGO PC */
        .top-nav { 
            background: rgba(255, 255, 255, 0.8); 
            backdrop-filter: blur(20px); 
            padding: 0 40px; 
            display: none; 
            justify-content: space-between; 
            align-items: center; 
            height: 70px; 
            position: sticky; 
            top: 0; 
            z-index: 999; 
            border-bottom: 0.5px solid rgba(0,0,0,0.1); 
        }
        #app-logo { 
            height: 45px !important; 
            width: auto !important; 
            max-width: 160px !important; 
            object-fit: contain; 
        }

        .profile-center { position: absolute; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
        #user-photo { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #display-profile-name { font-size: 9px; font-weight: 700; text-transform: uppercase; margin-top: 2px; }

        /* CONTENIDO */
        #app-content { display: none; padding: 20px; gap: 20px; max-width: 1600px; margin: 0 auto; }
        .side-panel { width: 320px; }
        .calendar-card { flex: 1; background: white; border-radius: 20px; padding: 15px; }
        
        /* ESTILO CALENDARIO IOS */
        .fc { border: none !important; font-family: inherit; }
        .fc-theme-standard td, .fc-theme-standard th { border: none !important; }
        .fc-daygrid-day-number { font-size: 14px; font-weight: 400; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; margin: 0 auto !important; }
        .fc-day-today .fc-daygrid-day-number { background: #ff3b30; color: white !important; border-radius: 50%; font-weight: 700; }
        .fc-col-header-cell-cushion { font-size: 11px; text-transform: uppercase; color: #8e8e93; font-weight: 600; text-decoration: none !important; }
        .fc-toolbar-title { font-size: 22px !important; font-weight: 700 !important; }
        .fc .fc-button-primary { background: var(--ios-gray) !important; color: #007aff !important; border: none !important; border-radius: 8px !important; font-weight: 600 !important; font-size: 13px !important; }
        .fc .fc-button-active { background: #007aff !important; color: white !important; }
        
        /* OCULTAR EVENTOS DENTRO DEL CALENDARIO PARA EL LOOK IPHONE */
        .fc-daygrid-event-harness { display: none; }
        .fc-daygrid-day-events { min-height: 10px !important; display: flex; justify-content: center; }
        .has-event-dot::after { content: ''; width: 4px; height: 4px; background: #8e8e93; border-radius: 50%; display: block; margin: 2px auto; }

        /* AGENDA DEL DÍA (ESTILO IPHONE) */
        #agenda-viewer { margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px; }
        .agenda-header { font-size: 18px; font-weight: 800; margin-bottom: 15px; color: #1d1d1f; display: flex; align-items: center; gap: 10px; }
        .agenda-header span { font-weight: 400; color: #8e8e93; }
        .event-ios-card { display: flex; align-items: center; padding: 12px 0; border-bottom: 0.5px solid #f2f2f7; cursor: pointer; transition: 0.2s; }
        .event-ios-card:active { background: #f2f2f7; }
        .event-time { width: 80px; font-size: 12px; font-weight: 600; color: #1d1d1f; }
        .event-time span { display: block; font-size: 10px; color: #8e8e93; font-weight: 400; }
        .event-bar { width: 4px; height: 35px; border-radius: 2px; margin: 0 15px; }
        .event-info { flex: 1; }
        .event-info h4 { margin: 0; font-size: 15px; font-weight: 600; }
        .event-info p { margin: 2px 0 0; font-size: 12px; color: #8e8e93; }

        /* ADMIN & MODALES */
        .glass-card { background: #fbfbfd; padding: 20px; border-radius: 20px; border: 1px solid #efeff4; }
        .doc-item { padding: 10px; border-radius: 12px; margin-bottom: 8px; display: flex; align-items: center; background: white; border: 1px solid #f2f2f7; font-size: 13px; gap: 10px; }
        .doc-thumb { width: 35px; height: 35px; border-radius: 8px; object-fit: cover; }
        
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); backdrop-filter: blur(10px); z-index: 10000; align-items: center; justify-content: center; }
        .modal-box { background: white; padding: 30px; border-radius: 30px; width: 90%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.1); }

        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 12px; border: 1px solid #d2d2d7; background: #f5f5f7; outline: none; }
        .btn-action { width: 100%; background: var(--brand-color); color: white; border: none; padding: 15px; border-radius: 12px; cursor: pointer; font-weight: 700; margin-top: 10px; }

        @media (max-width: 768px) {
            #app-content { flex-direction: column; padding: 10px; }
            .side-panel { width: 100%; order: 2; }
            .top-nav { padding: 0 15px; height: 60px; }
            #app-logo { height: 35px !important; }
            .modal-overlay { align-items: flex-end; }
            .modal-box { border-radius: 30px 30px 0 0; max-width: 100%; }
        }
    </style>
</head>
<body>

    <div id="toast" style="position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(100px); background:#1d1d1f; color:white; padding:12px 25px; border-radius:50px; z-index:11000; transition:0.5s;"></div>

    <div id="login-screen" style="position:fixed; inset:0; background:#ffffff; display:flex; align-items:center; justify-content:center; z-index:9999;">
        <div style="text-align:center; width: 320px;">
            <img src="Resiliencia.png" style="width:180px; margin-bottom:40px;" onerror="this.src='https://raw.githubusercontent.com/resilienciaguate/agendaresiliencia-12/main/Resiliencia.png'">
            <input type="email" id="email" placeholder="Correo electrónico">
            <input type="password" id="password" placeholder="Contraseña">
            <button class="btn-action" id="login-btn">Entrar</button>
        </div>
    </div>

    <div class="top-nav" id="nav-bar">
        <img id="app-logo" src="Resiliencia.png" onerror="this.src='https://raw.githubusercontent.com/resilienciaguate/agendaresiliencia-12/main/Resiliencia.png'">
        <div class="profile-center">
            <img id="user-photo" src="" style="display:none;">
            <span id="display-profile-name">Cargando...</span>
        </div>
        <div style="display:flex; gap:15px; align-items:center;">
            <div onclick="toggleUserConfig()" style="cursor:pointer; font-size:20px;">⚙️</div>
            <button id="logout-btn" style="border:none; background:none; color:#ff3b30; font-weight:700; font-size:12px;">SALIR</button>
        </div>
    </div>

    <div id="app-content">
        <div class="side-panel" id="side-panel-ui" style="display:none;">
            <div class="glass-card">
                <h3 style="margin:0 0 15px 0; font-size:16px;">Administración</h3>
                <input type="text" id="new-doc-name" placeholder="Nombre Psicóloga">
                <input type="email" id="new-doc-email" placeholder="Correo">
                <button class="btn-action" id="add-doc-btn">Añadir</button>
                <hr style="opacity:0.1; margin:20px 0;">
                <input type="month" id="report-month" onchange="recalcularAdmin(true)">
                <div id="docs-list" style="margin-top:10px;"></div>
            </div>
        </div>

        <div class="calendar-card">
            <div id='calendar'></div>
            
            <div id="agenda-viewer">
                <div class="agenda-header" id="agenda-title">Agenda <span>Selecciona un día</span></div>
                <div id="agenda-list">
                    <p style="color:#8e8e93; font-size:13px; text-align:center; padding:20px;">No hay citas para este día.</p>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-cita" class="modal-overlay"><div class="modal-box">
        <h3 id="modal-titulo" style="margin-top:0;">Agendar Cita</h3>
        <select id="select-psicologa-cita"></select>
        <input type="text" id="px-nombre" placeholder="Nombre Paciente">
        <div style="display:flex; gap:10px;">
            <select id="px-area" style="flex:1;"><option value="502">🇬🇹 +502</option><option value="1">🇺🇸 +1</option></select>
            <input type="number" id="px-whatsapp" placeholder="WhatsApp" style="flex:2;">
        </div>
        <input type="datetime-local" id="px-start">
        <textarea id="px-notas" placeholder="Notas..."></textarea>
        <button class="btn-action" id="btn-guardar-cita">Guardar</button>
        <button class="btn-action" style="background:#f2f2f7; color:#ff3b30;" id="btn-eliminar-cita">Eliminar</button>
        <button class="btn-action" style="background:none; color:#8e8e93;" onclick="cerrarModalCita()">Cancelar</button>
    </div></div>

    <div id="user-config-modal" class="modal-overlay"><div class="modal-box">
        <h3>Mi Perfil</h3>
        <input type="text" id="user-custom-name" placeholder="Nombre">
        <input type="file" id="user-photo-upload" accept="image/*">
        <button class="btn-action" id="save-profile-btn">Actualizar</button>
        <button class="btn-action" style="background:none; color:#8e8e93;" onclick="toggleUserConfig()">Cerrar</button>
    </div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, setDoc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyC-cNJm__gM_e0lijaG7DgYPikXfnuHRZA", authDomain: "agendaresiliencia-12.firebaseapp.com", projectId: "agendaresiliencia-12", storageBucket: "agendaresiliencia-12.firebasestorage.app", appId: "1:1068233469888:web:f958c72f406ac8698da225" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const ADMIN_EMAIL = "resilienciaguate@gmail.com";
        const PALETA = ["#FF5E5E", "#4FACFE", "#00F2FE", "#F9D423", "#A18CD1", "#84FAB0", "#FF9A9E", "#B210FF", "#30CFD0"];
        
        let equipoGlobal = [], citasGlobal = [], perfilesGlobal = {}, citaSeleccionadaId = null, filtroPsicologaActual = null;

        const showToast = (msg) => {
            const t = document.getElementById('toast');
            t.innerText = msg; t.style.transform = 'translateX(-50%) translateY(0)';
            setTimeout(() => t.style.transform = 'translateX(-50%) translateY(100px)', 3000);
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                const isAdmin = user.email.toLowerCase() === ADMIN_EMAIL;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('nav-bar').style.display = 'flex';
                document.getElementById('app-content').style.display = 'flex';
                if(isAdmin) document.getElementById('side-panel-ui').style.display = 'block';
                iniciarEscuchas(isAdmin, user.email.toLowerCase());
            }
        });

        function iniciarEscuchas(isAdmin, userEmail) {
            onSnapshot(collection(db, "perfiles"), (snap) => {
                perfilesGlobal = {}; snap.forEach(d => { perfilesGlobal[d.id] = d.data(); });
                recalcularAdmin(isAdmin);
                const mp = perfilesGlobal[userEmail];
                if(mp && mp.photo) { document.getElementById('user-photo').src = mp.photo; document.getElementById('user-photo').style.display = 'block'; }
                if(mp) document.getElementById('display-profile-name').innerText = mp.displayName || "Psicóloga";
            });
            onSnapshot(collection(db, "psicologas"), (snap) => { 
                equipoGlobal = snap.docs.map(d => ({id: d.id, ...d.data()})); 
                document.getElementById('select-psicologa-cita').innerHTML = equipoGlobal.map(p => `<option value="${p.email.toLowerCase()}">${p.name}</option>`).join('');
                recalcularAdmin(isAdmin);
            });
            onSnapshot(collection(db, "citas"), (snap) => { 
                citasGlobal = snap.docs.map(d => ({id: d.id, ...d.data()})); 
                actualizarCalendario(isAdmin);
                recalcularAdmin(isAdmin);
            });
        }

        function actualizarCalendario(isAdmin) {
            if(!window.calendarObj) {
                window.calendarObj = new FullCalendar.Calendar(document.getElementById('calendar'), {
                    initialView: 'dayGridMonth',
                    locale: 'es', firstDay: 1, 
                    headerToolbar: { left: 'title', center: '', right: 'dayGridMonth,timeGridWeek,timeGridDay' },
                    selectable: true,
                    dayCellDidMount: (info) => {
                        const dateStr = info.date.toISOString().split('T')[0];
                        const hasEvent = citasGlobal.some(c => c.start.startsWith(dateStr));
                        if(hasEvent) info.el.classList.add('has-event-dot');
                    },
                    dateClick: (info) => {
                        renderAgendaDia(info.dateStr);
                    },
                    select: (info) => abrirModalCita(null, info),
                    eventClick: (info) => abrirModalCita(info.event.id),
                    height: 'auto'
                });
                window.calendarObj.render();
            }
            window.calendarObj.removeAllEvents();
            citasGlobal.forEach(c => {
                const esPropio = c.user === auth.currentUser.email.toLowerCase();
                const cumpleFiltro = !filtroPsicologaActual || c.user === filtroPsicologaActual;
                if((isAdmin && cumpleFiltro) || (!isAdmin && esPropio)) {
                    window.calendarObj.addEvent({ id: c.id, title: c.title, start: c.start, end: c.end || c.start, color: c.color });
                }
            });
        }

        function renderAgendaDia(fechaStr) {
            const list = document.getElementById('agenda-list');
            const tit = document.getElementById('agenda-title');
            const citasDia = citasGlobal.filter(c => c.start.startsWith(fechaStr));
            
            tit.innerHTML = `Agenda <span>${fechaStr}</span>`;
            
            if(citasDia.length === 0) {
                list.innerHTML = `<p style="color:#8e8e93; font-size:13px; text-align:center; padding:20px;">No hay citas para este día.</p>`;
                return;
            }

            citasDia.sort((a,b) => a.start.localeCompare(b.start));
            list.innerHTML = citasDia.map(c => {
                const hora = c.start.split('T')[1].substring(0,5);
                return `
                    <div class="event-ios-card" onclick="abrirModalCita('${c.id}')">
                        <div class="event-time">${hora} <span>Sesión</span></div>
                        <div class="event-bar" style="background:${c.color}"></div>
                        <div class="event-info">
                            <h4>${c.title}</h4>
                            <p>${perfilesGlobal[c.user]?.displayName || 'Psicóloga'}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.recalcularAdmin = (isAdmin) => {
            if(!isAdmin) return;
            const mesSel = document.getElementById('report-month').value || new Date().toISOString().substring(0, 7);
            const counts = {};
            citasGlobal.forEach(c => { if(c.start.startsWith(mesSel)) counts[c.user] = (counts[c.user] || 0) + 1; });
            document.getElementById('docs-list').innerHTML = equipoGlobal.map(p => {
                const total = counts[p.email.toLowerCase()] || 0;
                const perf = perfilesGlobal[p.email.toLowerCase()] || {};
                return `<div class="doc-item" style="border-left:4px solid ${p.color}" onclick="filtrarPorPsicologa('${p.email.toLowerCase()}')">
                    <img src="${perf.photo || 'https://via.placeholder.com/40'}" class="doc-thumb">
                    <div style="flex:1"><b>${p.name}</b><br><small>${total} citas</small></div>
                </div>`;
            }).join('');
        };

        function abrirModalCita(id = null, info = null) {
            citaSeleccionadaId = id;
            if(id) {
                const c = citasGlobal.find(x => x.id === id);
                document.getElementById('px-nombre').value = c.title;
                document.getElementById('px-whatsapp').value = c.tel || "";
                document.getElementById('px-area').value = c.area || "502";
                document.getElementById('px-notas').value = c.notas || "";
                document.getElementById('px-start').value = c.start.substring(0, 16);
                document.getElementById('select-psicologa-cita').value = c.user;
                document.getElementById('btn-eliminar-cita').style.display = 'block';
            } else {
                document.getElementById('px-nombre').value = "";
                document.getElementById('px-start').value = info.startStr.substring(0, 16);
                document.getElementById('btn-eliminar-cita').style.display = 'none';
            }
            document.getElementById('modal-cita').style.display = 'flex';
        }

        document.getElementById('btn-guardar-cita').onclick = async () => {
            const psi = equipoGlobal.find(p => p.email.toLowerCase() === document.getElementById('select-psicologa-cita').value);
            const data = {
                title: document.getElementById('px-nombre').value,
                tel: document.getElementById('px-whatsapp').value,
                area: document.getElementById('px-area').value,
                notas: document.getElementById('px-notas').value,
                start: document.getElementById('px-start').value,
                user: psi.email.toLowerCase(),
                color: psi.color
            };
            if(citaSeleccionadaId) await updateDoc(doc(db, "citas", citaSeleccionadaId), data);
            else await addDoc(collection(db, "citas"), data);
            cerrarModalCita();
        };

        document.getElementById('save-profile-btn').onclick = async () => {
            const file = document.getElementById('user-photo-upload').files[0], name = document.getElementById('user-custom-name').value;
            let upd = { displayName: name };
            if(file) {
                const r = new FileReader(); r.readAsDataURL(file);
                r.onload = async (ev) => { upd.photo = ev.target.result; await setDoc(doc(db, "perfiles", auth.currentUser.email.toLowerCase()), upd, { merge: true }); toggleUserConfig(); };
            } else { await setDoc(doc(db, "perfiles", auth.currentUser.email.toLowerCase()), upd, { merge: true }); toggleUserConfig(); }
        };

        document.getElementById('add-doc-btn').onclick = async () => {
            const n = document.getElementById('new-doc-name').value, e = document.getElementById('new-doc-email').value;
            const color = PALETA[equipoGlobal.length % PALETA.length];
            await addDoc(collection(db, "psicologas"), { name: n, email: e.toLowerCase(), color: color });
        };

        window.filtrarPorPsicologa = (e) => { filtroPsicologaActual = e; actualizarCalendario(true); };
        document.getElementById('btn-eliminar-cita').onclick = async () => { if(confirm("¿Eliminar?")) { await deleteDoc(doc(db, "citas", citaSeleccionadaId)); cerrarModalCita(); }};
        document.getElementById('login-btn').onclick = () => { signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value); };
        document.getElementById('logout-btn').onclick = () => { signOut(auth).then(() => location.reload()); };
        window.cerrarModalCita = () => document.getElementById('modal-cita').style.display = 'none';
        window.toggleUserConfig = () => { const m = document.getElementById('user-config-modal'); m.style.display = m.style.display === 'flex' ? 'none' : 'flex'; };
    </script>
</body>
</html>
