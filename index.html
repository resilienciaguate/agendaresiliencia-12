<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Resiliencia | Suite Premium 2026</title>

    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/locales/es.global.min.js'></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --brand-color: #a5c941; 
            --glass-bg: rgba(255, 255, 255, 0.85);
            --apple-shadow: 0 10px 40px rgba(0,0,0,0.1);
            --text-dark: #1d1d1f;
        }

        html, body { min-height: 100%; margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: #f5f5f7; color: var(--text-dark); overflow-x: hidden; }

        /* NAVEGACIÓN APPLE */
        .top-nav { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(25px); padding: 0 30px; display: none; justify-content: space-between; align-items: center; height: 85px; position: sticky; top: 0; z-index: 999; border-bottom: 0.5px solid rgba(0,0,0,0.1); }
        .profile-center { position: absolute; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
        #user-photo { width: 42px; height: 42px; border-radius: 12px; object-fit: cover; margin-bottom: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border: 2px solid white; }
        #display-profile-name { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; opacity: 0.8; }

        /* CONTENIDO PRINCIPAL */
        #app-content { display: none; padding: 25px; gap: 25px; align-items: flex-start; }
        .side-panel { width: 300px; position: sticky; top: 110px; }
        .calendar-card { flex: 1; background: white; border-radius: 24px; padding: 20px; box-shadow: var(--apple-shadow); min-height: 650px; }
        .glass-card { background: var(--glass-bg); backdrop-filter: blur(15px); padding: 25px; border-radius: 24px; box-shadow: var(--apple-shadow); border: 1px solid rgba(255,255,255,0.4); }
        
        /* ADMIN UI */
        .doc-item { padding: 12px 15px; border-radius: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; background: white; border-left: 6px solid; box-shadow: 0 2px 5px rgba(0,0,0,0.03); cursor: pointer; transition: 0.2s; }
        .doc-item:hover { transform: translateX(5px); background: #fafafa; }
        .btn-del-doc { background: none; border: none; color: #ff3b30; cursor: pointer; font-size: 18px; opacity: 0.3; transition: 0.2s; padding: 0 5px; font-weight: 300; }
        .btn-del-doc:hover { opacity: 1; transform: scale(1.2); }
        
        .filter-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .btn-show-all { font-size: 10px; font-weight: 700; color: #007aff; cursor: pointer; text-transform: uppercase; background: rgba(0,122,255,0.1); padding: 4px 8px; border-radius: 6px; display: none; }

        /* MODALES */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.25); backdrop-filter: blur(18px); z-index: 10000; align-items: center; justify-content: center; padding: 20px; }
        .modal-box { background: white; padding: 35px; border-radius: 35px; width: 100%; max-width: 420px; box-shadow: 0 40px 80px rgba(0,0,0,0.15); text-align: center; border: 1px solid rgba(255,255,255,0.7); overflow-y: auto; max-height: 90vh; }

        input, select, textarea { width: 100%; padding: 14px; margin: 8px 0; border-radius: 14px; border: 1px solid #d2d2d7; font-family: inherit; box-sizing: border-box; font-size: 15px; outline: none; background: #fbfbfd; }
        input:focus { border-color: var(--brand-color); background: white; }
        .btn-action { width: 100%; background: var(--brand-color); color: white; border: none; padding: 16px; border-radius: 14px; cursor: pointer; font-weight: 700; margin-top: 10px; font-size: 15px; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-action:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-secondary { background: #f2f2f7; color: #1d1d1f; margin-top: 10px; }
        .btn-danger { background: #fff5f5; color: #ff3b30; margin-top: 15px; border: none; font-weight: 700; cursor: pointer; padding: 10px; border-radius: 10px; width: 100%; }
        
        /* CALENDARIO ESTILO APPLE */
        .fc .fc-button-primary { background: #e8e8ed !important; border: none !important; color: #1d1d1f !important; font-size: 13px !important; font-weight: 600 !important; border-radius: 10px !important; text-transform: capitalize !important; padding: 10px 15px !important; transition: 0.2s; }
        .fc .fc-button-active { background: #1d1d1f !important; color: white !important; }
        .fc-toolbar-title { font-size: 1.3em !important; font-weight: 800 !important; text-transform: capitalize !important; letter-spacing: -0.5px; }
        .fc-daygrid-day-number { font-weight: 600; padding: 8px !important; }

        /* TOAST NOTIFICATION */
        #toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(120px); background: #1d1d1f; color: white; padding: 14px 28px; border-radius: 50px; font-size: 14px; z-index: 11000; transition: 0.6s cubic-bezier(0.23, 1, 0.32, 1); box-shadow: 0 15px 35px rgba(0,0,0,0.3); font-weight: 600; }
        #toast.show { transform: translateX(-50%) translateY(0); }

        /* RESPONSIVE MÓVIL */
        @media (max-width: 768px) {
            #app-content { flex-direction: column; padding: 15px; }
            .side-panel { width: 100%; position: relative; top: 0; margin-bottom: 25px; }
            .fc .fc-toolbar { flex-direction: column; gap: 15px; }
            .top-nav { height: 75px; padding: 0 15px; }
            .profile-center { display: none; }
            #app-logo { max-height: 48px; }
            .calendar-card { padding: 12px; border-radius: 20px; }
        }
    </style>
</head>
<body>

    <div id="toast">Acción completada</div>

    <div id="login-screen" style="position:fixed; inset:0; background:#f5f5f7; display:flex; align-items:center; justify-content:center; z-index:9999;">
        <div class="modal-box" style="background:transparent; box-shadow:none; border:none;">
            <img src="Resiliencia.png" style="width:150px; margin-bottom: 30px;" onerror="this.src='https://raw.githubusercontent.com/resilienciaguate/agendaresiliencia-12/main/Resiliencia.png'">
            <div style="background:white; padding:40px; border-radius:35px; box-shadow: var(--apple-shadow);">
                <h2 style="font-size:24px; margin-bottom:25px; font-weight:800; letter-spacing: -1px;">BIENVENIDO</h2>
                <input type="email" id="email" placeholder="Correo electrónico">
                <input type="password" id="password" placeholder="Contraseña">
                <button class="btn-action" id="login-btn">Entrar al Sistema</button>
            </div>
        </div>
    </div>

    <div class="top-nav" id="nav-bar">
        <img id="app-logo" src="Resiliencia.png" onerror="this.src='https://raw.githubusercontent.com/resilienciaguate/agendaresiliencia-12/main/Resiliencia.png'">
        <div class="profile-center">
            <img id="user-photo" src="" alt="" style="display:none;">
            <span id="display-profile-name">Cargando...</span>
        </div>
        <div style="display:flex; align-items:center; gap:20px;">
            <div onclick="toggleUserConfig()" style="cursor:pointer; font-size:22px; opacity:0.8;">⚙️</div>
            <button id="logout-btn" style="background:none; color:#ff3b30; border:none; font-weight:800; cursor:pointer; font-size:12px;">SALIR</button>
        </div>
    </div>

    <div id="app-content">
        <div class="side-panel" id="side-panel-ui" style="display:none;">
            <div class="glass-card">
                <h3 style="margin:0 0 15px 0; font-size:17px; font-weight:800;">Administración</h3>
                <input type="text" id="new-doc-name" placeholder="Nombre Psicóloga">
                <input type="email" id="new-doc-email" placeholder="Correo">
                <button class="btn-action" id="add-doc-btn">Añadir Psicóloga</button>
                <hr style="opacity:0.1; margin:25px 0;">
                <div class="filter-header">
                    <label style="font-size:11px; font-weight:800; opacity:0.5; text-transform:uppercase;">Equipo Activo</label>
                    <span id="btn-show-all" class="btn-show-all" onclick="filtrarPorPsicologa(null)">Ver Todo</span>
                </div>
                <input type="month" id="report-month" onchange="recalcularAdmin(true)">
                <div id="docs-list" style="margin-top:15px;"></div>
            </div>
        </div>
        <div class="calendar-card"><div id='calendar'></div></div>
    </div>

    <div id="modal-cita" class="modal-overlay"><div class="modal-box">
        <h3 id="modal-titulo" style="font-weight:800; margin-bottom:20px;">Agendar Cita</h3>
        <select id="select-psicologa-cita"></select>
        <input type="text" id="px-nombre" placeholder="Nombre del Paciente">
        <div style="display:flex; gap:10px;">
            <select id="px-area" style="width:115px;">
                <option value="502">🇬🇹 +502</option>
                <option value="503">🇸🇻 +503</option>
                <option value="504">🇭🇳 +504</option>
                <option value="52">🇲🇽 +52</option>
                <option value="1">🇺🇸 +1</option>
            </select>
            <input type="number" id="px-whatsapp" placeholder="WhatsApp">
        </div>
        <label style="display:block; text-align:left; font-size:12px; margin-top:12px; font-weight:800; color:var(--brand-color);">FECHA Y HORA</label>
        <input type="datetime-local" id="px-start">
        <textarea id="px-notas" placeholder="Notas de la sesión... (Motivo, seguimiento, etc.)" style="height: 90px;"></textarea>
        
        <button class="btn-action" id="btn-guardar-cita">Guardar Cita</button>
        <button class="btn-danger" id="btn-eliminar-cita" style="display:none;">Eliminar Cita</button>
        <button class="btn-action btn-secondary" onclick="cerrarModalCita()">Cerrar</button>
    </div></div>

    <div id="user-config-modal" class="modal-overlay"><div class="modal-box">
        <h3 style="font-weight:800;">Mi Perfil</h3>
        <input type="text" id="user-custom-name" placeholder="Tu Nombre Público">
        <label style="display:block; text-align:left; font-size:11px; margin-top:10px; font-weight:700;">FOTO DE PERFIL</label>
        <input type="file" id="user-photo-upload" accept="image/*">
        <button class="btn-action" id="save-profile-btn">Actualizar Perfil</button>
        <button class="btn-action btn-secondary" onclick="toggleUserConfig()">Cerrar</button>
    </div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, setDoc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyC-cNJm__gM_e0lijaG7DgYPikXfnuHRZA", authDomain: "agendaresiliencia-12.firebaseapp.com", projectId: "agendaresiliencia-12", storageBucket: "agendaresiliencia-12.firebasestorage.app", appId: "1:1068233469888:web:f958c72f406ac8698da225" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const ADMIN_EMAIL = "resilienciaguate@gmail.com";
        const PALETA = ["#FF5E5E", "#4FACFE", "#00F2FE", "#F9D423", "#A18CD1", "#84FAB0", "#FF9A9E", "#B210FF", "#30CFD0"];
        
        let equipoGlobal = [], citasGlobal = [], citaSeleccionadaId = null, filtroPsicologaActual = null;

        const showToast = (msg) => {
            const t = document.getElementById('toast');
            t.innerText = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                const isAdmin = user.email.toLowerCase() === ADMIN_EMAIL;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('nav-bar').style.display = 'flex';
                document.getElementById('app-content').style.display = 'flex';
                if(isAdmin) document.getElementById('side-panel-ui').style.display = 'block';
                iniciarEscuchas(isAdmin, user.email.toLowerCase());
            }
        });

        function iniciarEscuchas(isAdmin, userEmail) {
            onSnapshot(doc(db, "perfiles", userEmail), (s) => { 
                if(s.exists()){ 
                    const d = s.data(); 
                    if(d.photo) { document.getElementById('user-photo').src = d.photo; document.getElementById('user-photo').style.display = 'block'; }
                    document.getElementById('display-profile-name').innerText = d.displayName || "Psicóloga"; 
                } 
            });
            onSnapshot(collection(db, "psicologas"), (snap) => { 
                equipoGlobal = snap.docs.map(d => ({id: d.id, ...d.data()})); 
                document.getElementById('select-psicologa-cita').innerHTML = equipoGlobal.map(p => `<option value="${p.email.toLowerCase()}">${p.name}</option>`).join('');
                recalcularAdmin(isAdmin);
            });
            onSnapshot(collection(db, "citas"), (snap) => { 
                citasGlobal = snap.docs.map(d => ({id: d.id, ...d.data()})); 
                actualizarCalendario(isAdmin);
                recalcularAdmin(isAdmin);
            });
        }

        function actualizarCalendario(isAdmin) {
            if(!window.calendarObj) {
                window.calendarObj = new FullCalendar.Calendar(document.getElementById('calendar'), {
                    initialView: 'dayGridMonth',
                    locale: 'es', firstDay: 1, 
                    headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek,timeGridDay' },
                    buttonText: { today: 'Hoy', month: 'Mes', week: 'Semana', day: 'Día' },
                    dateClick: (info) => { window.calendarObj.changeView('timeGridDay', info.dateStr); },
                    select: (info) => abrirModalCita(null, info),
                    eventClick: (info) => abrirModalCita(info.event.id),
                    selectable: true, height: 'auto',
                    slotMinTime: '07:00:00', slotMaxTime: '21:00:00'
                });
                window.calendarObj.render();
            }
            window.calendarObj.removeAllEvents();
            citasGlobal.forEach(c => {
                const esPropio = c.user === auth.currentUser.email.toLowerCase();
                const cumpleFiltro = !filtroPsicologaActual || c.user === filtroPsicologaActual;
                if((isAdmin && cumpleFiltro) || (!isAdmin && esPropio)) {
                    window.calendarObj.addEvent({ id: c.id, title: c.title, start: c.start, end: c.end || c.start, color: c.color });
                }
            });
        }

        function abrirModalCita(id = null, info = null) {
            citaSeleccionadaId = id;
            const btnDel = document.getElementById('btn-eliminar-cita');
            if(id) {
                const c = citasGlobal.find(x => x.id === id);
                document.getElementById('modal-titulo').innerText = "Modificar Cita";
                document.getElementById('px-nombre').value = c.title;
                document.getElementById('px-whatsapp').value = c.tel || "";
                document.getElementById('px-area').value = c.area || "502";
                document.getElementById('px-notas').value = c.notas || "";
                document.getElementById('px-start').value = c.start.substring(0, 16);
                document.getElementById('select-psicologa-cita').value = c.user;
                btnDel.style.display = 'block';
            } else {
                document.getElementById('modal-titulo').innerText = "Nueva Cita";
                document.getElementById('px-nombre').value = "";
                document.getElementById('px-whatsapp').value = "";
                document.getElementById('px-notas').value = "";
                document.getElementById('px-start').value = info.startStr.includes('T') ? info.startStr.substring(0, 16) : info.startStr + "T08:00";
                btnDel.style.display = 'none';
            }
            document.getElementById('modal-cita').style.display = 'flex';
        }

        document.getElementById('btn-guardar-cita').onclick = async () => {
            const psi = equipoGlobal.find(p => p.email.toLowerCase() === document.getElementById('select-psicologa-cita').value);
            const fechaHora = document.getElementById('px-start').value;
            const final = new Date(new Date(fechaHora).getTime() + 60*60*1000).toISOString().substring(0, 16);
            
            const data = {
                title: document.getElementById('px-nombre').value,
                tel: document.getElementById('px-whatsapp').value,
                area: document.getElementById('px-area').value,
                notas: document.getElementById('px-notas').value,
                start: fechaHora,
                end: final,
                user: psi.email.toLowerCase(),
                color: psi.color
            };
            if(!data.title) return showToast("Falta nombre del paciente");
            
            if(citaSeleccionadaId) await updateDoc(doc(db, "citas", citaSeleccionadaId), data);
            else await addDoc(collection(db, "citas"), data);
            
            showToast("Agenda actualizada");
            cerrarModalCita();
        };

        window.recalcularAdmin = (isAdmin) => {
            if(!isAdmin) return;
            const mesSel = document.getElementById('report-month').value || new Date().toISOString().substring(0, 7);
            const counts = {};
            citasGlobal.forEach(c => { if(c.start.startsWith(mesSel)) counts[c.user] = (counts[c.user] || 0) + 1; });
            document.getElementById('docs-list').innerHTML = equipoGlobal.map(p => {
                const total = counts[p.email.toLowerCase()] || 0;
                return `<div class="doc-item" style="border-color:${p.color}" onclick="filtrarPorPsicologa('${p.email.toLowerCase()}')">
                    <div style="display:flex; flex-direction:column;"><span>${p.name}</span><span style="opacity:0.6; font-size:11px;">${total} citas en el mes</span></div>
                    <button class="btn-del-doc" onclick="event.stopPropagation(); eliminarPsicologa('${p.id}')">×</button>
                </div>`;
            }).join('');
        };

        window.filtrarPorPsicologa = (e) => { filtroPsicologaActual = e; document.getElementById('btn-show-all').style.display = e ? 'block' : 'none'; actualizarCalendario(true); };
        window.eliminarPsicologa = async (id) => { if(confirm("¿Eliminar psicóloga del equipo?")) await deleteDoc(doc(db, "psicologas", id)); };
        document.getElementById('btn-eliminar-cita').onclick = async () => { if(confirm("¿Segura que deseas eliminar esta cita?")) { await deleteDoc(doc(db, "citas", citaSeleccionadaId)); cerrarModalCita(); showToast("Cita eliminada"); }};
        
        document.getElementById('add-doc-btn').onclick = async () => {
            const n = document.getElementById('new-doc-name').value, e = document.getElementById('new-doc-email').value;
            if(!n || !e) return showToast("Completa los datos");
            const color = PALETA.find(c => !equipoGlobal.map(p => p.color).includes(c)) || PALETA[0];
            await addDoc(collection(db, "psicologas"), { name: n, email: e.toLowerCase(), color: color });
            document.getElementById('new-doc-name').value = ""; document.getElementById('new-doc-email').value = "";
            showToast("Psicóloga añadida correctamente");
        };

        document.getElementById('save-profile-btn').onclick = async () => {
            const file = document.getElementById('user-photo-upload').files[0], name = document.getElementById('user-custom-name').value;
            let upd = { displayName: name };
            if(file) {
                const r = new FileReader(); r.readAsDataURL(file);
                r.onload = async (ev) => { upd.photo = ev.target.result; await setDoc(doc(db, "perfiles", auth.currentUser.email.toLowerCase()), upd, { merge: true }); toggleUserConfig(); showToast("Perfil actualizado"); };
            } else { await setDoc(doc(db, "perfiles", auth.currentUser.email.toLowerCase()), upd, { merge: true }); toggleUserConfig(); showToast("Perfil actualizado"); }
        };

        document.getElementById('login-btn').onclick = () => {
            signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value)
                .then(() => showToast("Bienvenida"))
                .catch(() => showToast("Error en credenciales"));
        };

        document.getElementById('logout-btn').onclick = () => { signOut(auth); location.reload(); };
        window.cerrarModalCita = () => document.getElementById('modal-cita').style.display = 'none';
        window.toggleUserConfig = () => { const m = document.getElementById('user-config-modal'); m.style.display = m.style.display === 'flex' ? 'none' : 'flex'; };
    </script>
</body>
</html>
