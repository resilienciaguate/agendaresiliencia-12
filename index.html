<div id="login-screen">
        <div style="text-align:center; background:white; padding:50px; border-radius:20px; width:80%; max-width:320px; margin: 100px auto; box-shadow: 0 10px 25px rgba(0,0,0,0.08);">
            <img src="https://raw.githubusercontent.com/resilienciaguate/agendaresiliencia-12/main/Resiliencia.png" width="100">
            <div class="logo-text">AGENDA RESILIENCIA 2026</div>
            <input type="email" id="email" placeholder="Correo corporativo">
            <input type="password" id="password" placeholder="Contraseña">
            <button class="btn-action" id="login-btn">ENTRAR</button>
        </div>
    </div>

    <nav class="top-nav" id="nav-bar" style="display:none;">
        <div id="display-profile-name" style="font-weight:600; font-size: 13px;"></div>
        <div class="nav-links">
            <a href="#" class="nav-item active" onclick="window.showView('Agenda')">Agenda</a>
            <a href="#" class="nav-item" onclick="window.showView('Pacientes')">Pacientes</a>
            <a href="#" class="nav-item" onclick="window.showView('Reportes')">Reportes</a>
        </div>
        <button id="logout-btn">SALIR</button>
    </nav>

    <main id="app-content" style="display:none;">

        <aside class="side-panel" id="main-sidebar">
            <button class="panel-toggle" onclick="window.toggleSidebar()">‹</button>
            
            <img id="main-app-logo" src="https://raw.githubusercontent.com/resilienciaguate/agendaresiliencia-12/main/Resiliencia.png" class="app-logo-clinic">
            <div id="welcome-text" class="logo-text">AGENDA RESILIENCIA 2026</div>
            
            <input type="text" id="search-input" placeholder="Buscar paciente...">
            <button id="btn-reset-search" class="btn-action btn-secondary" style="display:none; font-size: 10px; margin-bottom:10px;">MOSTRAR TODOS</button>
            
            <div id="psico-view-only" style="display:none; margin-top: 25px; width: 100%;">
                <h3 style="font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 15px; border-top: 1px solid #eee; padding-top: 20px;">
                    Próximas citas de hoy
                </h3>
                <div id="lista-pendientes-dia" style="display: flex; flex-direction: column; gap: 12px;"></div>
            </div>

            <div id="side-panel-ui" style="display:none; width: 100%;">
                <h4 style="font-size:11px; margin-bottom:10px; color:#999; text-transform:uppercase;">Equipo</h4>
                <div id="admin-unified-list"></div>
                <hr style="margin:20px 0; border:0.5px solid #eee;">
                <input type="text" id="new-doc-name" placeholder="Nombre Psicóloga">
                <input type="email" id="new-doc-email" placeholder="Correo">
                <button class="btn-action btn-secondary" id="add-doc-btn">AÑADIR AL EQUIPO</button>
            </div>
        </aside>

        <div id="view-agenda" class="main-stage">
            <section class="calendar-card">
                <div id='calendar'></div>
            </section>
        </div>

        <div id="view-pacientes" class="main-stage" style="display:none;">
            <section class="calendar-card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <h2 style="margin:0; font-size:18px; color:var(--brand-dark);">Directorio de Pacientes</h2>
                    <input type="text" id="search-paciente-tab" placeholder="Filtrar por nombre o teléfono..." style="width:300px; margin:0;">
                </div>
                <div style="overflow-x:auto;">
                    <table style="width:100%; border-collapse: collapse; font-size:13px;">
                        <thead>
                            <tr style="text-align:left; border-bottom:2px solid var(--bg-page); color:#888;">
                                <th style="padding:12px;">PACIENTE</th>
                                <th style="padding:12px;">ÚLTIMO CONTACTO</th>
                                <th style="padding:12px;">TELÉFONO</th>
                                <th style="padding:12px; text-align:center;">CITAS</th>
                                <th style="padding:12px;">ACCIONES</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-pacientes-body"></tbody>
                    </table>
                </div>
            </section>
        </div>
