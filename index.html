<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Resiliencia | Suite Premium 2026</title>

    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/locales/es.global.min.js'></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --brand-color: #a5c941; 
            --glass-bg: rgba(255, 255, 255, 0.85);
            --apple-shadow: 0 10px 40px rgba(0,0,0,0.1);
            --text-dark: #1d1d1f;
        }

        html, body { min-height: 100%; margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: #f5f5f7; color: var(--text-dark); }

        /* NAVEGACIÓN APPLE */
        .top-nav { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(25px); padding: 0 30px; display: none; justify-content: space-between; align-items: center; height: 85px; position: sticky; top: 0; z-index: 999; border-bottom: 0.5px solid rgba(0,0,0,0.1); }
        .profile-center { position: absolute; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
        #user-photo { width: 42px; height: 42px; border-radius: 12px; object-fit: cover; margin-bottom: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        #display-profile-name { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; opacity: 0.8; }

        /* CONTENIDO PRINCIPAL */
        #app-content { display: none; padding: 25px; gap: 25px; align-items: flex-start; }
        .side-panel { width: 300px; position: sticky; top: 110px; }
        .calendar-card { flex: 1; background: white; border-radius: 24px; padding: 20px; box-shadow: var(--apple-shadow); }
        .glass-card { background: var(--glass-bg); backdrop-filter: blur(15px); padding: 25px; border-radius: 24px; box-shadow: var(--apple-shadow); border: 1px solid rgba(255,255,255,0.4); }
        
        /* ADMIN UI */
        .doc-item { padding: 12px 15px; border-radius: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; background: white; border-left: 6px solid; box-shadow: 0 2px 5px rgba(0,0,0,0.03); cursor: pointer; transition: 0.2s; }
        .doc-item:hover { transform: translateX(5px); background: #fafafa; }
        .btn-del-doc { background: none; border: none; color: #ff3b30; cursor: pointer; font-size: 18px; opacity: 0.3; transition: 0.2s; padding: 0 5px; font-weight: 300; }
        .btn-del-doc:hover { opacity: 1; transform: scale(1.2); }
        
        .filter-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .btn-show-all { font-size: 10px; font-weight: 700; color: #007aff; cursor: pointer; text-transform: uppercase; background: rgba(0,122,255,0.1); padding: 4px 8px; border-radius: 6px; display: none; }

        /* MODALES */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.15); backdrop-filter: blur(20px); z-index: 10000; align-items: center; justify-content: center; }
        .modal-box { background: rgba(255,255,255,0.95); padding: 35px; border-radius: 30px; width: 90%; max-width: 380px; box-shadow: 0 30px 60px rgba(0,0,0,0.1); text-align: center; border: 1px solid rgba(255,255,255,0.5); overflow-y: auto; max-height: 90vh; }

        input, select, textarea { width: 100%; padding: 14px; margin: 8px 0; border-radius: 12px; border: 1px solid #d2d2d7; font-family: inherit; box-sizing: border-box; font-size: 14px; }
        .btn-action { width: 100%; background: var(--brand-color); color: white; border: none; padding: 15px; border-radius: 12px; cursor: pointer; font-weight: 600; margin-top: 5px; font-size: 14px; }
        .btn-secondary { background: #e8e8ed; color: #1d1d1f; margin-top: 10px; }
        .btn-danger { background: #fff5f5; color: #ff3b30; border: 1px solid #ff3b30; margin-top: 10px; }
        
        .note-display { background: rgba(0,0,0,0.03); padding: 15px; border-radius: 14px; margin: 15px 0; text-align: left; font-size: 14px; color: #48484a; border-left: 4px solid var(--brand-color); }
        
        /* CALENDARIO ESTILO APPLE */
        .fc .fc-button-primary { background: #e8e8ed !important; border: none !important; color: #1d1d1f !important; font-size: 13px !important; font-weight: 600 !important; border-radius: 8px !important; text-transform: capitalize !important; }
        .fc .fc-button-active { background: #1d1d1f !important; color: white !important; }
        .fc-toolbar-title { font-size: 1.2em !important; font-weight: 700 !important; text-transform: capitalize !important; }

        /* TOAST ELEGANTE */
        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1d1d1f; color: white; padding: 12px 25px; border-radius: 50px; font-size: 14px; z-index: 11000; transition: 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28); }
        #toast.show { transform: translateX(-50%) translateY(0); }

        /* MÓVIL RESPONSIVE */
        @media (max-width: 768px) {
            #app-content { flex-direction: column; padding: 15px; }
            .side-panel { width: 100%; position: relative; top: 0; margin-bottom: 20px; }
            .fc .fc-toolbar { flex-direction: column; gap: 10px; }
            .fc-toolbar-title { font-size: 1em !important; }
            .top-nav { height: 70px; padding: 0 15px; }
        }
    </style>
</head>
<body>

    <div id="toast">Cargando...</div>

    <div id="login-screen" style="position:fixed; inset:0; background:#f5f5f7; display:flex; align-items:center; justify-content:center; z-index:9999;">
        <div class="modal-box" style="background:transparent; box-shadow:none; border:none;">
            <div id="logo-container-login" style="margin-bottom: 25px;">
                <img id="login-logo-img" src="Resiliencia.png" 
                     style="width:160px; height:auto; margin: 0 auto; display:block; object-fit:contain;"
                     onerror="this.src='https://raw.githubusercontent.com/resilienciaguate/agendaresiliencia-12/main/Resiliencia.png'">
            </div>
            <div style="background:white; padding:35px; border-radius:30px; box-shadow: var(--apple-shadow);">
                <h2 style="font-size:22px; margin-bottom:30px; font-weight:800; color: #1d1d1f; letter-spacing: -0.5px;">AGENDA RESILIENCIA 2026</h2>
                <input type="email" id="email" placeholder="Correo electrónico">
                <input type="password" id="password" placeholder="Contraseña">
                <button class="btn-action" id="login-btn">Acceder al Sistema</button>
            </div>
        </div>
    </div>

    <div class="top-nav" id="nav-bar">
        <img id="app-logo" src="Resiliencia.png" style="max-height:55px; width:auto; display:block;" onerror="this.src='https://raw.githubusercontent.com/resilienciaguate/agendaresiliencia-12/main/Resiliencia.png'">
        <div class="profile-center">
            <img id="user-photo" src="" alt="" style="display:none;">
            <span id="display-profile-name">Cargando...</span>
        </div>
        <div style="display:flex; align-items:center; gap:15px;">
            <div onclick="toggleUserConfig()" style="cursor:pointer; font-size:18px; opacity:0.7;">⚙️</div>
            <button id="logout-btn" style="background:none; color:#ff3b30; border:none; font-weight:700; cursor:pointer; font-size:11px;">SALIR</button>
        </div>
    </div>

    <div id="app-content">
        <div class="side-panel" id="side-panel-ui" style="display:none;">
            <div class="glass-card">
                <h3 style="margin:0 0 15px 0; font-size:16px;">Administración</h3>
                <input type="text" id="new-doc-name" placeholder="Nombre Psicóloga">
                <input type="email" id="new-doc-email" placeholder="Correo">
                <button class="btn-action" id="add-doc-btn">Añadir al Equipo</button>
                <hr style="opacity:0.1; margin:20px 0;">
                <div class="filter-header">
                    <label style="font-size:11px; font-weight:700; opacity:0.5; text-transform:uppercase;">Equipo</label>
                    <span id="btn-show-all" class="btn-show-all" onclick="filtrarPorPsicologa(null)">Mostrar todos</span>
                </div>
                <input type="month" id="report-month" onchange="recalcularAdmin(true)">
                <div id="docs-list" style="margin-top:15px;"></div>
            </div>
        </div>
        <div class="calendar-card"><div id='calendar'></div></div>
    </div>

    <div id="modal-cita" class="modal-overlay"><div class="modal-box">
        <h3 id="modal-titulo">Agendar Cita</h3>
        <select id="select-psicologa-cita"></select>
        <input type="text" id="px-nombre" placeholder="Nombre del Paciente">
        <div style="display:flex; gap:8px;">
            <select id="px-area" style="width:110px;"><option value="502">🇬🇹 +502</option><option value="503">🇸🇻 +503</option><option value="1">🇺🇸 +1</option></select>
            <input type="number" id="px-whatsapp" placeholder="WhatsApp">
        </div>
        <label style="display:block; text-align:left; font-size:11px; margin-top:10px;">INICIO / FIN</label>
        <input type="datetime-local" id="px-start">
        <input type="datetime-local" id="px-end">
        <textarea id="px-notas" placeholder="Notas de la sesión..."></textarea>
        
        <button class="btn-action" id="btn-guardar-cita">Guardar y Notificar</button>
        <button class="btn-action btn-danger" id="btn-eliminar-cita" style="display:none;">Eliminar Permanente</button>
        <button class="btn-action btn-secondary" onclick="cerrarModalCita()">Cancelar</button>
    </div></div>

    <div id="user-config-modal" class="modal-overlay"><div class="modal-box">
        <h3>Mi Perfil</h3>
        <input type="text" id="user-custom-name" placeholder="Tu Nombre">
        <input type="file" id="user-photo-upload" accept="image/*">
        <button class="btn-action" id="save-profile-btn">Guardar</button>
        <button class="btn-action btn-secondary" onclick="toggleUserConfig()">Cerrar</button>
    </div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, setPersistence, browserLocalPersistence, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, setDoc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyC-cNJm__gM_e0lijaG7DgYPikXfnuHRZA", authDomain: "agendaresiliencia-12.firebaseapp.com", projectId: "agendaresiliencia-12", storageBucket: "agendaresiliencia-12.firebasestorage.app", appId: "1:1068233469888:web:f958c72f406ac8698da225" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const ADMIN_EMAIL = "resilienciaguate@gmail.com";
        const PALETA = ["#FF5E5E", "#4FACFE", "#00F2FE", "#F9D423", "#A18CD1", "#84FAB0", "#FF9A9E", "#B210FF", "#30CFD0"];
        
        let equipoGlobal = [], citasGlobal = [], tempSelection = null, citaSeleccionadaId = null, filtroPsicologaActual = null;

        const showToast = (msg) => {
            const t = document.getElementById('toast');
            t.innerText = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                const isAdmin = user.email.toLowerCase() === ADMIN_EMAIL;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('nav-bar').style.display = 'flex';
                document.getElementById('app-content').style.display = 'flex';
                if(isAdmin) document.getElementById('side-panel-ui').style.display = 'block';
                iniciarEscuchas(isAdmin, user.email.toLowerCase());
            }
        });

        function iniciarEscuchas(isAdmin, userEmail) {
            onSnapshot(doc(db, "perfiles", userEmail), (s) => { 
                if(s.exists()){ 
                    const d = s.data(); 
                    if(d.photo) { document.getElementById('user-photo').src = d.photo; document.getElementById('user-photo').style.display = 'block'; }
                    document.getElementById('display-profile-name').innerText = d.displayName || "Psicóloga"; 
                } 
            });
            onSnapshot(collection(db, "psicologas"), (snap) => { 
                equipoGlobal = snap.docs.map(d => ({id: d.id, ...d.data()})); 
                actualizarSelectorPsicologas();
                recalcularAdmin(isAdmin);
            });
            onSnapshot(collection(db, "citas"), (snap) => { 
                citasGlobal = snap.docs.map(d => ({id: d.id, ...d.data()})); 
                actualizarCalendario(isAdmin);
                recalcularAdmin(isAdmin);
            });
        }

        window.recalcularAdmin = (isAdmin) => {
            if(!isAdmin) return;
            const mesSel = document.getElementById('report-month').value || new Date().toISOString().substring(0, 7);
            const counts = {};
            citasGlobal.forEach(c => { if(c.start && c.start.startsWith(mesSel)) counts[c.user] = (counts[c.user] || 0) + 1; });
            document.getElementById('docs-list').innerHTML = equipoGlobal.map(p => {
                const total = counts[p.email.toLowerCase()] || 0;
                return `<div class="doc-item" style="border-color:${p.color}" onclick="filtrarPorPsicologa('${p.email.toLowerCase()}')"><div style="display:flex; flex-direction:column;"><span>${p.name}</span><span style="opacity:0.6; font-size:11px;">${total} px/mes</span></div><button class="btn-del-doc" onclick="event.stopPropagation(); eliminarPsicologa('${p.id}', '${p.name}')">×</button></div>`;
            }).join('');
        };

        window.filtrarPorPsicologa = (email) => {
            filtroPsicologaActual = email;
            document.getElementById('btn-show-all').style.display = email ? 'block' : 'none';
            actualizarCalendario(auth.currentUser.email.toLowerCase() === ADMIN_EMAIL);
        };

        window.eliminarPsicologa = async (id, nombre) => {
            if(confirm(`¿Eliminar a ${nombre}?`)) await deleteDoc(doc(db, "psicologas", id));
        };

        document.getElementById('add-doc-btn').onclick = async () => {
            const n = document.getElementById('new-doc-name').value, e = document.getElementById('new-doc-email').value;
            if(!n || !e) return;
            const color = PALETA.find(c => !equipoGlobal.map(p => p.color).includes(c)) || PALETA[0];
            await addDoc(collection(db, "psicologas"), { name: n, email: e.toLowerCase(), color: color });
            document.getElementById('new-doc-name').value = ""; document.getElementById('new-doc-email').value = "";
            showToast("Psicóloga añadida");
        };

        function actualizarCalendario(isAdmin) {
            if(!window.calendarObj) {
                window.calendarObj = new FullCalendar.Calendar(document.getElementById('calendar'), {
                    initialView: window.innerWidth < 768 ? 'timeGridDay' : 'dayGridMonth',
                    locale: 'es', firstDay: 1, 
                    slotMinTime: '08:00:00', slotMaxTime: '19:00:00',
                    headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek,timeGridDay' },
                    select: (info) => abrirModalCita(null, info),
                    eventClick: (info) => abrirModalCita(info.event.id),
                    selectable: true, height: 'auto'
                });
                window.calendarObj.render();
            }
            window.calendarObj.removeAllEvents();
            citasGlobal.forEach(c => {
                const esPropio = c.user === auth.currentUser.email.toLowerCase();
                const pasaFiltro = !filtroPsicologaActual || c.user === filtroPsicologaActual;
                if((isAdmin && pasaFiltro) || (!isAdmin && esPropio)) window.calendarObj.addEvent({ id: c.id, title: c.title, start: c.start, end: c.end, color: c.color });
            });
        }

        function abrirModalCita(id = null, info = null) {
            citaSeleccionadaId = id;
            const btnDel = document.getElementById('btn-eliminar-cita');
            if(id) {
                const c = citasGlobal.find(x => x.id === id);
                document.getElementById('modal-titulo').innerText = "Editar Cita";
                document.getElementById('px-nombre').value = c.title;
                document.getElementById('px-whatsapp').value = c.tel;
                document.getElementById('px-area').value = c.area || "502";
                document.getElementById('px-notas').value = c.notas || "";
                document.getElementById('px-start').value = c.start.substring(0, 16);
                document.getElementById('px-end').value = c.end.substring(0, 16);
                document.getElementById('select-psicologa-cita').value = c.user;
                btnDel.style.display = 'block';
            } else {
                document.getElementById('modal-titulo').innerText = "Agendar Cita";
                document.getElementById('px-nombre').value = "";
                document.getElementById('px-whatsapp').value = "";
                document.getElementById('px-notas').value = "";
                document.getElementById('px-start').value = info.startStr.substring(0, 16);
                document.getElementById('px-end').value = info.endStr.substring(0, 16);
                btnDel.style.display = 'none';
            }
            document.getElementById('modal-cita').style.display = 'flex';
        }

        document.getElementById('btn-guardar-cita').onclick = async () => {
            const psi = equipoGlobal.find(p => p.email.toLowerCase() === document.getElementById('select-psicologa-cita').value);
            const data = {
                title: document.getElementById('px-nombre').value,
                tel: document.getElementById('px-whatsapp').value,
                area: document.getElementById('px-area').value,
                notas: document.getElementById('px-notas').value,
                start: document.getElementById('px-start').value,
                end: document.getElementById('px-end').value,
                user: psi.email.toLowerCase(),
                color: psi.color
            };
            if(citaSeleccionadaId) await updateDoc(doc(db, "citas", citaSeleccionadaId), data);
            else await addDoc(collection(db, "citas"), data);
            
            showToast("Cita guardada");
            cerrarModalCita();
        };

        document.getElementById('btn-eliminar-cita').onclick = async () => {
            if(confirm("¿Eliminar cita definitivamente?")) {
                await deleteDoc(doc(db, "citas", citaSeleccionadaId));
                showToast("Cita eliminada");
                cerrarModalCita();
            }
        };

        document.getElementById('save-profile-btn').onclick = async () => {
            const file = document.getElementById('user-photo-upload').files[0], name = document.getElementById('user-custom-name').value;
            let upd = { displayName: name };
            if(file) {
                const r = new FileReader(); r.readAsDataURL(file);
                r.onload = async (ev) => { upd.photo = ev.target.result; await setDoc(doc(db, "perfiles", auth.currentUser.email.toLowerCase()), upd, { merge: true }); toggleUserConfig(); showToast("Perfil actualizado"); };
            } else { await setDoc(doc(db, "perfiles", auth.currentUser.email.toLowerCase()), upd, { merge: true }); toggleUserConfig(); showToast("Perfil actualizado"); }
        };

        document.getElementById('login-btn').onclick = () => {
            signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value)
                .then(() => showToast("Bienvenida"))
                .catch(() => showToast("Credenciales incorrectas"));
        };

        document.getElementById('logout-btn').onclick = () => { signOut(auth); location.reload(); };
        window.cerrarModalCita = () => { document.getElementById('modal-cita').style.display = 'none'; window.calendarObj.unselect(); };
        window.toggleUserConfig = () => { const m = document.getElementById('user-config-modal'); m.style.display = m.style.display === 'flex' ? 'none' : 'flex'; };
        function actualizarSelectorPsicologas() { 
            document.getElementById('select-psicologa-cita').innerHTML = equipoGlobal.map(p => `<option value="${p.email.toLowerCase()}">${p.name}</option>`).join(''); 
        }
    </script>
</body>
</html>
