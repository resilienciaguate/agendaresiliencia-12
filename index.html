<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Resiliencia | Suite Premium 2026</title>

    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/locales/es.global.min.js'></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --brand-color: #a5c941; 
            --glass-bg: rgba(255, 255, 255, 0.85);
            --apple-shadow: 0 10px 40px rgba(0,0,0,0.1);
            --text-dark: #1d1d1f;
            --ios-gray: #f2f2f7;
            --ios-selection: #e5e5ea;
            --wpp-green: #25D366;
            --wpp-blue: #007aff;
        }

        html, body { 
            min-height: 100%; 
            margin: 0; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #f5f5f7; 
            color: var(--text-dark); 
            overflow-x: hidden; 
            -webkit-font-smoothing: antialiased;
        }

        /* --- NAVEGACIÓN Y HEADER --- */
        .top-nav { 
            background: rgba(255, 255, 255, 0.75); 
            backdrop-filter: blur(25px); 
            padding: 0 30px; 
            display: none; 
            justify-content: space-between; 
            align-items: center; 
            height: 85px; 
            position: sticky; 
            top: 0; 
            z-index: 999; 
            border-bottom: 0.5px solid rgba(0,0,0,0.1); 
        }

        #app-logo { 
            height: auto !important; 
            width: auto !important; 
            max-width: 160px !important; 
            max-height: 60px !important; 
            object-fit: contain; 
        }

        .profile-center { 
            position: absolute; 
            left: 50%; 
            transform: translateX(-50%); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        #user-photo { 
            width: 42px; 
            height: 42px; 
            border-radius: 12px; 
            object-fit: cover; 
            margin-bottom: 4px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
            border: 2px solid white; 
        }

        #display-profile-name { 
            font-size: 10px; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 0.8px; 
            opacity: 0.8; 
        }

        /* --- LAYOUT PRINCIPAL --- */
        #app-content { 
            display: none; 
            padding: 25px; 
            gap: 25px; 
            align-items: flex-start; 
            max-width: 1600px;
            margin: 0 auto;
        }

        .side-panel { 
            width: 320px; 
            position: sticky; 
            top: 110px; 
        }

        .calendar-card { 
            flex: 1; 
            background: white; 
            border-radius: 24px; 
            padding: 20px; 
            box-shadow: var(--apple-shadow); 
            min-height: 700px; 
            overflow: hidden;
        }

        .glass-card { 
            background: var(--glass-bg); 
            backdrop-filter: blur(15px); 
            padding: 25px; 
            border-radius: 24px; 
            box-shadow: var(--apple-shadow); 
            border: 1px solid rgba(255,255,255,0.4); 
        }

        /* --- ADMIN INTERFACE --- */
        .doc-item { 
            padding: 12px 15px; 
            border-radius: 14px; 
            margin-bottom: 10px; 
            display: flex; 
            align-items: center; 
            font-size: 13px; 
            font-weight: 600; 
            background: white; 
            border-left: 6px solid; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.03); 
            cursor: pointer; 
            transition: all 0.2s ease; 
            gap: 12px; 
        }

        .doc-item:hover { 
            transform: translateX(5px); 
            background: #fafafa; 
        }

        .doc-thumb { 
            width: 38px; 
            height: 38px; 
            border-radius: 10px; 
            object-fit: cover; 
            background: #eee; 
        }

        .btn-del-doc { 
            margin-left: auto; 
            background: none; 
            border: none; 
            color: #ff3b30; 
            cursor: pointer; 
            font-size: 18px; 
            opacity: 0.3; 
            transition: 0.2s; 
        }

        .btn-del-doc:hover { opacity: 1; transform: scale(1.2); }

        .btn-show-all { 
            font-size: 10px; 
            font-weight: 800; 
            color: #007aff; 
            cursor: pointer; 
            text-transform: uppercase; 
            background: rgba(0,122,255,0.1); 
            padding: 5px 10px; 
            border-radius: 6px; 
            display: none; 
        }

        /* --- CALENDARIO ESTILOS (CONTROLADOS) --- */
        .fc { border: none !important; max-height: 800px; }
        .fc-theme-standard td, .fc-theme-standard th { border: 0.5px solid #f2f2f7 !important; }
        
        /* Limitar altura de las celdas para que no se deforme */
        .fc-daygrid-day-frame {
            max-height: 100px !important;
            overflow: hidden !important;
        }

        .fc-col-header-cell-cushion { font-size: 11px; text-transform: uppercase; color: #8e8e93; font-weight: 700; text-decoration: none !important; }
        
        .fc-daygrid-day-number { 
            font-size: 14px; 
            font-weight: 500;
            width: 32px; 
            height: 32px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 2px auto !important; 
            text-decoration: none !important; 
            color: var(--text-dark);
        }

        /* Estilo para los nombres de pacientes en el calendario */
        .fc-event {
            border: none !important;
            padding: 1px 4px !important;
            font-size: 9px !important;
            border-radius: 4px !important;
            margin-bottom: 1px !important;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block !important;
        }

        /* VISTA USUARIO (iPhone Style + Privacy) */
        .mode-user .fc-day-today .fc-daygrid-day-number { 
            background: #ff3b30 !important; 
            color: white !important; 
            border-radius: 50%; 
        }

        .mode-user .selected-day .fc-daygrid-day-number { 
            background: var(--ios-selection) !important; 
            color: black !important; 
            border-radius: 50%; 
        }

        /* --- AGENDA DEL DÍA --- */
        #agenda-viewer { 
            margin-top: 30px; 
            border-top: 1px solid #f2f2f7; 
            padding-top: 25px; 
            display: none; 
        }

        .agenda-header { 
            font-size: 20px; 
            font-weight: 800; 
            margin-bottom: 20px; 
            color: #1d1d1f; 
        }

        .event-ios-card { 
            display: flex; 
            align-items: center; 
            padding: 15px 0; 
            border-bottom: 0.5px solid #f2f2f7; 
            cursor: pointer; 
        }

        .event-time { 
            width: 85px; 
            font-size: 13px; 
            font-weight: 700; 
        }

        .event-bar { 
            width: 4px; 
            height: 40px; 
            border-radius: 2px; 
            margin: 0 18px; 
        }

        /* --- MODALES --- */
        .modal-overlay { 
            display: none; 
            position: fixed; 
            inset: 0; 
            background: rgba(0,0,0,0.3); 
            backdrop-filter: blur(15px); 
            z-index: 10000; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
        }

        .modal-box { 
            background: white; 
            padding: 35px; 
            border-radius: 35px; 
            width: 100%; 
            max-width: 440px; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.2); 
            max-height: 90vh;
            overflow-y: auto;
        }

        input, select, textarea { 
            width: 100%; 
            padding: 14px; 
            margin: 8px 0; 
            border-radius: 14px; 
            border: 1px solid #d2d2d7; 
            font-family: inherit; 
            box-sizing: border-box;
        }

        .btn-action { 
            width: 100%; 
            background: var(--brand-color); 
            color: white; 
            border: none; 
            padding: 16px; 
            border-radius: 14px; 
            cursor: pointer; 
            font-weight: 700; 
            margin-top: 10px; 
        }

        .btn-wpp { background: var(--wpp-green); margin-top: 15px; }
        .btn-reminder { background: var(--wpp-blue); }

        @media (max-width: 768px) {
            #app-content { flex-direction: column; padding: 10px; }
            .side-panel { width: 100%; position: relative; top: 0; margin-bottom: 15px; }
            .modal-overlay { align-items: flex-end; padding: 0; }
            .modal-box { border-radius: 30px 30px 0 0; max-width: 100%; margin: 0; }
        }

    </style>
</head>
<body class="mode-user">

    <div id="toast" style="position:fixed; bottom:40px; left:50%; transform:translateX(-50%) translateY(120px); background:#1d1d1f; color:white; padding:14px 28px; border-radius:50px; z-index:11000; transition:0.6s; font-weight:600;"></div>

    <div id="login-screen" style="position:fixed; inset:0; background:#f5f5f7; display:flex; align-items:center; justify-content:center; z-index:9999;">
        <div class="modal-box" style="background:transparent; box-shadow:none;">
            <img src="Resiliencia.png" style="width:160px; margin-bottom: 40px; display:block; margin-left:auto; margin-right:auto;">
            <div style="background:white; padding:40px; border-radius:35px; box-shadow: var(--apple-shadow);">
                <input type="email" id="email" placeholder="Correo electrónico">
                <input type="password" id="password" placeholder="Contraseña">
                <button class="btn-action" id="login-btn">Entrar</button>
            </div>
        </div>
    </div>

    <div class="top-nav" id="nav-bar">
        <img id="app-logo" src="Resiliencia.png">
        <div class="profile-center">
            <img id="user-photo" src="" style="display:none;">
            <span id="display-profile-name">Cargando...</span>
        </div>
        <div style="display:flex; align-items:center; gap:25px;">
            <div onclick="toggleUserConfig()" style="cursor:pointer; font-size:24px;">⚙️</div>
            <button id="logout-btn" style="background:none; color:#ff3b30; border:none; font-weight:800; cursor:pointer;">SALIR</button>
        </div>
    </div>

    <div id="app-content">
        <div class="side-panel" id="side-panel-ui" style="display:none;">
            <div class="glass-card">
                <input type="text" id="new-doc-name" placeholder="Nombre Psicóloga">
                <input type="email" id="new-doc-email" placeholder="Correo">
                <button class="btn-action" id="add-doc-btn">Registrar Psicóloga</button>
                <hr style="opacity:0.1; margin:25px 0;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                    <label style="font-size:11px; font-weight:800; opacity:0.5;">EQUIPO</label>
                    <span id="btn-show-all" class="btn-show-all" onclick="filtrarPorPsicologa(null)">Ver Todo</span>
                </div>
                <input type="month" id="report-month" onchange="recalcularAdmin(true)">
                <div id="docs-list"></div>
            </div>
        </div>

        <div class="calendar-card">
            <div id='calendar'></div>
            <div id="agenda-viewer">
                <div class="agenda-header" id="agenda-title">Citas</div>
                <div id="agenda-list"></div>
            </div>
        </div>
    </div>

    <div id="modal-cita" class="modal-overlay"><div class="modal-box">
        <h3 id="modal-titulo" style="font-weight:800;">Detalles de la Cita</h3>
        <select id="select-psicologa-cita"></select>
        <input type="text" id="px-nombre" placeholder="Nombre del Paciente">
        <div style="display:flex; gap:10px;">
            <select id="px-area" style="width:120px;"><option value="502">🇬🇹 +502</option><option value="1">🇺🇸 +1</option></select>
            <input type="number" id="px-whatsapp" placeholder="WhatsApp">
        </div>
        <input type="datetime-local" id="px-start">
        <textarea id="px-notas" placeholder="Notas..."></textarea>
        <button class="btn-action" id="btn-guardar-cita">Guardar</button>
        <div id="wpp-actions" style="display:none;">
            <button class="btn-action btn-wpp" id="btn-confirmar-wpp">Confirmar WhatsApp</button>
            <button class="btn-action btn-reminder" id="btn-recordatorio-wpp">Enviar Recordatorio</button>
        </div>
        <button class="btn-action" id="btn-eliminar-cita" style="display:none; background:#fff5f5; color:#ff3b30;">Eliminar</button>
        <button class="btn-action" style="background:#f2f2f7; color:#1d1d1f;" onclick="cerrarModalCita()">Cerrar</button>
    </div></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, setDoc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyC-cNJm__gM_e0lijaG7DgYPikXfnuHRZA", 
            authDomain: "agendaresiliencia-12.firebaseapp.com", 
            projectId: "agendaresiliencia-12", 
            storageBucket: "agendaresiliencia-12.firebasestorage.app", 
            appId: "1:1068233469888:web:f958c72f406ac8698da225" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const ADMIN_EMAIL = "resilienciaguate@gmail.com";
        const PALETA = ["#FF5E5E", "#4FACFE", "#00F2FE", "#F9D423", "#A18CD1", "#84FAB0", "#FF9A9E", "#B210FF", "#30CFD0"];
        
        let equipoGlobal = [], citasGlobal = [], perfilesGlobal = {}, citaSeleccionadaId = null, filtroPsicologaActual = null, globalIsAdmin = false;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                globalIsAdmin = user.email.toLowerCase() === ADMIN_EMAIL;
                document.body.className = globalIsAdmin ? "mode-admin" : "mode-user";
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('nav-bar').style.display = 'flex';
                document.getElementById('app-content').style.display = 'flex';
                if(globalIsAdmin) document.getElementById('side-panel-ui').style.display = 'block';
                iniciarEscuchas(globalIsAdmin, user.email.toLowerCase());
            }
        });

        function iniciarEscuchas(isAdmin, userEmail) {
            onSnapshot(collection(db, "perfiles"), (snap) => {
                perfilesGlobal = {}; snap.forEach(d => { perfilesGlobal[d.id] = d.data(); });
                const mp = perfilesGlobal[userEmail];
                if(mp && mp.photo) { document.getElementById('user-photo').src = mp.photo; document.getElementById('user-photo').style.display = 'block'; }
                if(mp) document.getElementById('display-profile-name').innerText = mp.displayName || "Psicóloga";
            });

            onSnapshot(collection(db, "psicologas"), (snap) => { 
                equipoGlobal = snap.docs.map(d => ({id: d.id, ...d.data()})); 
                document.getElementById('select-psicologa-cita').innerHTML = equipoGlobal.map(p => 
                    `<option value="${p.email.toLowerCase()}">${p.name}</option>`
                ).join('');
            });

            onSnapshot(collection(db, "citas"), (snap) => { 
                const allCitas = snap.docs.map(d => ({id: d.id, ...d.data()})); 
                // PRIVACIDAD QUIRÚRGICA: Si no es admin, solo ve sus citas
                if(!globalIsAdmin) {
                    citasGlobal = allCitas.filter(c => c.user === auth.currentUser.email.toLowerCase());
                } else {
                    citasGlobal = allCitas;
                }
                actualizarCalendario(globalIsAdmin);
                recalcularAdmin(globalIsAdmin);
            });
        }

        function actualizarCalendario(isAdmin) {
            if(!window.calendarObj) {
                window.calendarObj = new FullCalendar.Calendar(document.getElementById('calendar'), {
                    initialView: 'dayGridMonth',
                    locale: 'es',
                    firstDay: 1, 
                    slotMinTime: '07:00:00',
                    slotMaxTime: '19:00:00',
                    headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek,timeGridDay' },
                    selectable: true,
                    dateClick: (info) => {
                        if (window.calendarObj.view.type === 'dayGridMonth') {
                            if(isAdmin) window.calendarObj.changeView('timeGridDay', info.dateStr);
                            else {
                                document.querySelectorAll('.selected-day').forEach(el => el.classList.remove('selected-day'));
                                info.dayEl.classList.add('selected-day');
                                renderAgendaDia(info.dateStr);
                            }
                        }
                    },
                    select: (info) => { if(window.calendarObj.view.type !== 'dayGridMonth') abrirModalCita(null, info); },
                    eventClick: (info) => abrirModalCita(info.event.id),
                    height: 'auto'
                });
                window.calendarObj.render();
            }
            
            window.calendarObj.removeAllEvents();
            citasGlobal.forEach(c => {
                // Filtro para el Admin (botón de psicóloga lateral)
                const cumpleFiltroAdmin = !filtroPsicologaActual || c.user === filtroPsicologaActual;
                if(isAdmin ? cumpleFiltroAdmin : true) {
                    window.calendarObj.addEvent({ 
                        id: c.id, 
                        title: c.title, // Ahora el nombre se ve en el calendario
                        start: c.start, 
                        color: c.color 
                    });
                }
            });
        }

        function enviarWhatsApp(tipo) {
            const nombre = document.getElementById('px-nombre').value, tel = document.getElementById('px-whatsapp').value, area = document.getElementById('px-area').value, fechaVal = document.getElementById('px-start').value;
            if(!tel || !fechaVal) return;
            const dt = new Date(fechaVal);
            const fmt = dt.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
            let msg = tipo === 'confirmar' ? `Hola *${nombre}*, te saludamos de *Clínica Resiliencia*. Confirmamos tu sesión para el día *${fmt}*.` : `Recordatorio de sesión: *${nombre}*, te esperamos a las *${dt.getHours()}:${dt.getMinutes().toString().padStart(2,'0')}*.`;
            window.open(`https://wa.me/${area}${tel}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function abrirModalCita(id = null, info = null) {
            citaSeleccionadaId = id;
            const wpp = document.getElementById('wpp-actions'), del = document.getElementById('btn-eliminar-cita');
            if(id) {
                const c = citasGlobal.find(x => x.id === id);
                document.getElementById('px-nombre').value = c.title;
                document.getElementById('px-whatsapp').value = c.tel || "";
                document.getElementById('px-area').value = c.area || "502";
                document.getElementById('px-start').value = c.start.substring(0, 16);
                document.getElementById('px-notas').value = c.notas || "";
                document.getElementById('select-psicologa-cita').value = c.user;
                wpp.style.display = 'block'; del.style.display = 'block';
            } else {
                document.getElementById('px-nombre').value = ""; document.getElementById('px-whatsapp').value = "";
                document.getElementById('px-start').value = info.startStr.substring(0, 16);
                wpp.style.display = 'none'; del.style.display = 'none';
            }
            document.getElementById('modal-cita').style.display = 'flex';
        }

        window.renderAgendaDia = (fechaStr) => {
            const list = document.getElementById('agenda-list');
            const citasDia = citasGlobal.filter(c => c.start.startsWith(fechaStr));
            document.getElementById('agenda-viewer').style.display = 'block';
            document.getElementById('agenda-title').innerText = `Citas: ${fechaStr}`;
            list.innerHTML = citasDia.length ? citasDia.sort((a,b)=>a.start.localeCompare(b.start)).map(c => `
                <div class="event-ios-card" onclick="abrirModalCita('${c.id}')">
                    <div class="event-time">${c.start.split('T')[1].substring(0,5)}</div>
                    <div class="event-bar" style="background:${c.color}"></div>
                    <div><h4>${c.title}</h4><p>${c.tel || ''}</p></div>
                </div>
            `).join('') : '<p>Sin citas.</p>';
        };

        window.recalcularAdmin = (isAdmin) => {
            if(!isAdmin) return;
            const mesSel = document.getElementById('report-month').value || new Date().toISOString().substring(0, 7);
            const counts = {};
            citasGlobal.forEach(c => { if(c.start.startsWith(mesSel)) counts[c.user] = (counts[c.user] || 0) + 1; });
            document.getElementById('docs-list').innerHTML = equipoGlobal.map(p => {
                const perf = perfilesGlobal[p.email.toLowerCase()] || {};
                return `<div class="doc-item" style="border-color:${p.color}" onclick="filtrarPorPsicologa('${p.email.toLowerCase()}')">
                    <img src="${perf.photo || 'https://via.placeholder.com/40'}" class="doc-thumb">
                    <div style="flex:1;"><b>${p.name}</b><br><small>${counts[p.email.toLowerCase()] || 0} citas</small></div>
                </div>`;
            }).join('');
        };

        document.getElementById('btn-guardar-cita').onclick = async () => {
            const psiEmail = document.getElementById('select-psicologa-cita').value;
            const psi = equipoGlobal.find(p => p.email.toLowerCase() === psiEmail);
            const data = { title: document.getElementById('px-nombre').value, tel: document.getElementById('px-whatsapp').value, area: document.getElementById('px-area').value, notas: document.getElementById('px-notas').value, start: document.getElementById('px-start').value, user: psiEmail, color: psi.color };
            if(citaSeleccionadaId) await updateDoc(doc(db, "citas", citaSeleccionadaId), data);
            else await addDoc(collection(db, "citas"), data);
            cerrarModalCita();
        };

        document.getElementById('btn-confirmar-wpp').onclick = () => enviarWhatsApp('confirmar');
        document.getElementById('btn-recordatorio-wpp').onclick = () => enviarWhatsApp('recordatorio');
        window.filtrarPorPsicologa = (e) => { filtroPsicologaActual = e; document.getElementById('btn-show-all').style.display = e ? 'block' : 'none'; actualizarCalendario(true); };
        document.getElementById('btn-eliminar-cita').onclick = async () => { if(confirm("¿Eliminar?")) { await deleteDoc(doc(db, "citas", citaSeleccionadaId)); cerrarModalCita(); }};
        document.getElementById('login-btn').onclick = () => { signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value); };
        document.getElementById('logout-btn').onclick = () => { signOut(auth).then(() => location.reload()); };
        window.cerrarModalCita = () => document.getElementById('modal-cita').style.display = 'none';
        document.getElementById('add-doc-btn').onclick = async () => {
            const n = document.getElementById('new-doc-name').value, e = document.getElementById('new-doc-email').value;
            await addDoc(collection(db, "psicologas"), { name: n, email: e.toLowerCase(), color: PALETA[equipoGlobal.length % 9] });
        };
    </script>
</body>
</html>
