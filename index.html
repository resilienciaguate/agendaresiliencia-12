<style>
/* Solo se activa en pantallas pequeñas */
@media (max-width: 768px) {
    /* 1. Liberamos el espacio del calendario */
    #app-content {
        padding: 10px !important;
        position: relative !important;
        display: block !important; /* Evita que el flex de PC empuje los elementos */
    }

    /* 2. Convertimos el panel en un cajón flotante */
    .side-panel {
        position: fixed !important;
        left: 0 !important;
        top: 0 !important;
        bottom: 0 !important;
        width: 280px !important;
        z-index: 3000 !important; /* Por encima de todo */
        transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1) !important;
        box-shadow: 10px 0 25px rgba(0,0,0,0.2) !important;
        padding-top: 60px !important;
    }

    /* Estado oculto del panel */
    .side-panel.collapsed {
        transform: translateX(-100%) !important;
    }

    /* 3. La Flecha para abrir/cerrar (Estética y funcional) */
    .panel-toggle {
        display: flex !important;
        position: absolute !important;
        right: -40px !important;
        top: 100px !important;
        background: #8e8e93 !important;
        color: white !important;
        width: 40px !important;
        height: 40px !important;
        border-radius: 0 8px 8px 0 !important;
        align-items: center !important;
        justify-content: center !important;
        font-size: 24px !important;
        border: none !important;
        box-shadow: 4px 0 10px rgba(0,0,0,0.1) !important;
    }

    /* 4. El Calendario ahora usa todo el ancho */
    .main-stage {
        width: 100% !important;
        margin-left: 0 !important;
    }
}
</style>

<script>
// Esta función maneja la flecha en móvil sin afectar la PC
window.toggleSidebar = () => {
    const sb = document.getElementById('main-sidebar');
    const btn = document.querySelector('.panel-toggle');
    if (!sb) return;

    const isCollapsed = sb.classList.toggle('collapsed');
    
    // Cambiamos el símbolo de la flecha
    if (btn) btn.innerText = isCollapsed ? '›' : '‹';

    // Ajustamos el calendario al nuevo ancho disponible
    if (window.calendarObj) {
        setTimeout(() => window.calendarObj.updateSize(), 400);
    }
};

// Forzar que el panel empiece cerrado en móviles al cargar
if (window.innerWidth < 768) {
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('main-sidebar')?.classList.add('collapsed');
    });
}
</script>

</html>
