<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Resiliencia | Suite Premium 2026</title>

    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/locales/es.global.min.js'></script>
    
    <style>
        :root { 
            --brand-color: #a5c941; 
            --brand-dark: #8eb336;
            --apple-bg: #f5f5f7;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --apple-shadow: 0 10px 40px rgba(0,0,0,0.06);
            --text-dark: #1d1d1f;
            --text-light: #86868b;
            --ios-gray: #f2f2f7; 
            --ios-gray-dark: #e5e5ea;
            --danger: #ff3b30;
        }

        /* TIPOGRAFÍA BÁSICA Y ELEGANTE */
        html, body { 
            min-height: 100%; margin: 0; padding: 0;
            font-family: Arial, Helvetica, sans-serif; 
            background: var(--apple-bg); color: var(--text-dark); 
            overflow-x: hidden; -webkit-font-smoothing: antialiased;
        }

        #toast {
            position: fixed; bottom: 40px; left: 50%;
            transform: translateX(-50%) translateY(150px);
            background: rgba(29, 29, 31, 0.9); backdrop-filter: blur(20px);
            color: white; padding: 14px 28px; border-radius: 50px;
            z-index: 99999; transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        #toast.show { transform: translateX(-50%) translateY(0); }

        /* NAVEGACIÓN SUPERIOR */
        .top-nav { 
            background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(25px); 
            padding: 0 20px; display: none; justify-content: space-between; 
            align-items: center; height: 64px; position: sticky; top: 0; 
            z-index: 1000; border-bottom: 0.5px solid rgba(0,0,0,0.1); 
        }
        #app-logo { max-width: 80px; cursor: pointer; }
        
        .profile-center { 
            position: absolute; left: 50%; transform: translateX(-50%); 
            display: flex; flex-direction: column; align-items: center; 
        }
        #user-photo { 
            width: 36px; height: 36px; border-radius: 50%; 
            object-fit: cover; border: 1.5px solid white; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); cursor: pointer;
            display: none;
        }
        #display-profile-name { font-size: 8px; font-weight: 800; text-transform: uppercase; margin-top: 3px; letter-spacing: 0.8px; }

        /* LAYOUT PRINCIPAL */
        #app-content { display: none; padding: 20px; gap: 20px; max-width: 1600px; margin: 0 auto; }

        /* PANEL LATERAL ADMIN */
        .side-panel { width: 320px; }
        .glass-card { 
            background: white; padding: 30px 22px; border-radius: 32px; box-shadow: var(--apple-shadow); 
            min-height: 80vh; display: flex; flex-direction: column;
        }
        .glass-card h3 { font-weight: 700; font-size: 20px; margin-bottom: 25px; }
        
        .glass-card input {
            background: #f2f2f7; border: 1px solid rgba(0,0,0,0.05);
            border-radius: 14px; padding: 12px 16px; font-size: 14px; margin-bottom: 10px; width: 100%; box-sizing: border-box;
        }

        #btn-reset-filter {
            display: none; background: #1c1c1e; color: white; border: none;
            padding: 10px; border-radius: 12px; font-size: 11px; font-weight: bold;
            margin-bottom: 15px; cursor: pointer; width: 100%;
        }

        /* LISTA PSICÓLOGAS */
        .doc-item {
            background: white; border-radius: 16px; padding: 10px 14px; 
            margin-bottom: 8px; display: flex; align-items: center; gap: 12px; 
            border: 1px solid rgba(0,0,0,0.03); border-left: 4px solid;
            transition: 0.2s; cursor: pointer;
        }
        .doc-thumb { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; background: #f2f2f7; }
        .doc-info h4 { margin: 0; font-size: 13px; font-weight: 600; }
        .doc-info p { margin: 0; font-size: 10px; color: #86868b; }

        /* CALENDARIO PREMIUM */
        .calendar-card { flex: 1; background: white; border-radius: 35px; padding: 25px; box-shadow: var(--apple-shadow); }
        .fc-day-other { visibility: hidden; } /* OCULTAR DÍAS DE OTROS MESES */

        /* Círculo Gris de Selección */
        .fc-daygrid-day.fc-day-selected .fc-daygrid-day-number {
            background-color: #e5e5ea !important;
            color: #1d1d1f !important;
            border-radius: 50%;
            width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
        }

        /* MODAL PX: CUADRO PEQUEÑO Y MONOCHROME */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); backdrop-filter: blur(10px); z-index: 10000; align-items: center; justify-content: center; }
        .modal-box { 
            background: #ffffff; padding: 24px; border-radius: 24px; 
            width: 290px; box-shadow: 0 20px 50px rgba(0,0,0,0.1);
        }
        .modal-box h3 { margin: 0 0 15px; font-weight: 700; font-size: 17px; text-align: center; }
        .modal-box label { font-size: 9px; font-weight: 800; color: #aeaeb2; text-transform: uppercase; margin-top: 10px; display: block; }
        
        .modal-box input, .modal-box select, .modal-box textarea { 
            background: #f2f2f7; border: none; border-radius: 12px; padding: 12px; 
            margin-top: 4px; font-size: 14px; width: 100%; box-sizing: border-box; outline: none;
        }

        /* BOTONES ELEGANTES GRISES/NEGROS */
        .btn-px { 
            width: 100%; border: none; padding: 12px; border-radius: 12px; 
            cursor: pointer; font-weight: 600; font-size: 13px; margin-top: 8px;
            transition: 0.2s;
        }
        .btn-black { background: #1c1c1e; color: white; }
        .btn-gray { background: #f2f2f7; color: #1c1c1e; }
        .btn-cancel { background: transparent; color: #8e8e93; font-size: 11px; margin-top: 5px; }

        /* --- RECUPERACIÓN DISEÑO MÓVIL --- */
        @media (max-width: 850px) {
            #app-content { flex-direction: column; padding: 10px; }
            .side-panel { width: 100%; order: 2; }
            /* Ocultar eventos dentro de los cuadritos en móvil para que no se vea saturado */
            .fc-daygrid-event-harness { display: none !important; }
            .calendar-card { border-radius: 0; background: transparent; box-shadow: none; padding: 5px; }
            
            #agenda-viewer { 
                display: block !important; 
                margin-top: 15px; 
                background: white; 
                border-radius: 28px; 
                padding: 22px; 
                box-shadow: var(--apple-shadow); 
            }
        }

        /* ELEMENTOS DE LA LISTA DE AGENDA TIPO EVENTO iOS */
        .event-ios-card { 
            display: flex; align-items: center; padding: 12px 0; 
            border-bottom: 0.5px solid #f2f2f7; cursor: pointer; 
        }
        .event-time { width: 55px; font-size: 12px; font-weight: 800; color: var(--text-dark); }
        .event-bar { width: 4px; height: 35px; border-radius: 4px; margin: 0 12px; }
        .event-info-title { font-weight: 700; font-size: 14px; color: var(--text-dark); }
        .event-info-sub { font-size: 10px; color: var(--text-light); }
    </style>
</head>
<body>

    <div id="toast"></div>

    <div id="login-screen" style="position:fixed; inset:0; background:var(--apple-bg); display:flex; align-items:center; justify-content:center; z-index:10001;">
        <div style="text-align:center; width: 85%; max-width: 300px;">
            <img src="Resiliencia.png" style="width:110px; margin-bottom: 30px;">
            <div style="background:white; padding:30px 20px; border-radius:28px; box-shadow: var(--apple-shadow);">
                <input type="email" id="email" placeholder="Correo" style="width:100%; padding:14px; border-radius:12px; border:1px solid #ddd; margin-bottom:10px; box-sizing:border-box;">
                <input type="password" id="password" placeholder="Contraseña" style="width:100%; padding:14px; border-radius:12px; border:1px solid #ddd; margin-bottom:20px; box-sizing:border-box;">
                <button class="btn-px btn-black" id="login-btn">Entrar</button>
            </div>
        </div>
    </div>

    <div class="top-nav" id="nav-bar">
        <img id="app-logo" src="Resiliencia.png" onclick="location.reload()">
        <div class="profile-center">
            <img id="user-photo" src="" onclick="abrirConfigPerfil()">
            <span id="display-profile-name"></span>
        </div>
        <button id="logout-btn" style="background:none; color:var(--danger); border:none; font-weight:800; cursor:pointer; font-size:10px;">SALIR</button>
    </div>

    <div id="app-content">
        <div class="side-panel" id="side-panel-ui" style="display:none;">
            <div class="glass-card">
                <h3>Administración</h3>
                <input type="text" id="new-doc-name" placeholder="Nombre completo">
                <input type="email" id="new-doc-email" placeholder="Correo electrónico">
                <button class="btn-px btn-black" id="add-doc-btn">+ Registrar</button>
                
                <div style="margin-top:20px;">
                    <button id="btn-reset-filter" onclick="filtrarPorEspecialista(null)">← Ver todas las psicólogas</button>
                    <label style="font-size:9px; font-weight:800; color:var(--text-light);">REPORTE MENSUAL</label>
                    <input type="month" id="report-month" onchange="recalcularAdmin()" style="margin-top:5px;">
                </div>
                <div id="docs-list" style="margin-top:15px; flex:1; overflow-y:auto;"></div>
            </div>
        </div>

        <div class="calendar-card">
            <div id='calendar'></div>
            <div id="agenda-viewer" style="display:none;">
                <h3 id="agenda-title" style="margin:0 0 12px; font-weight:800; font-size:17px;">Sesiones</h3>
                <div id="agenda-list"></div>
            </div>
        </div>
    </div>

    <div id="modal-cita" class="modal-overlay">
        <div class="modal-box">
            <h3>Sesión</h3>
            <label>Especialista</label>
            <select id="select-psicologa-cita"></select>
            <label>Paciente</label>
            <input type="text" id="px-nombre">
            <label>WhatsApp</label>
            <input type="number" id="px-whatsapp">
            <label>Fecha y Hora</label>
            <input type="datetime-local" id="px-start">
            
            <button class="btn-px btn-black" id="btn-guardar-cita">Guardar Cita</button>
            <div id="wpp-actions" style="display:none; flex-direction:column;">
                <button class="btn-px btn-gray" id="btn-confirmar-wpp">Confirmar WhatsApp</button>
                <button class="btn-px btn-gray" id="btn-recordatorio-wpp">Recordatorio</button>
            </div>
            <button class="btn-px btn-cancel" id="btn-eliminar-cita" style="color:var(--danger)">Eliminar Permanente</button>
            <button class="btn-px btn-cancel" onclick="cerrarModalCita()">Cerrar</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, setDoc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyC-cNJm__gM_e0lijaG7DgYPikXfnuHRZA", 
            authDomain: "agendaresiliencia-12.firebaseapp.com", 
            projectId: "agendaresiliencia-12", 
            storageBucket: "agendaresiliencia-12.firebasestorage.app", 
            appId: "1:1068233469888:web:f958c72f406ac8698da225" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const ADMIN_EMAIL = "resilienciaguate@gmail.com";
        const PALETA = ["#FF5E5E", "#4FACFE", "#00F2FE", "#F9D423", "#A18CD1", "#84FAB0"];
        
        let equipoGlobal = [], citasGlobal = [], perfilesGlobal = {}, citaSeleccionadaId = null, globalIsAdmin = false, base64FotoTemp = "", filtroEspecialista = null;

        window.lanzarToast = (msg) => {
            const t = document.getElementById('toast');
            t.innerText = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                globalIsAdmin = user.email.toLowerCase() === ADMIN_EMAIL;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('nav-bar').style.display = 'flex';
                document.getElementById('app-content').style.display = 'flex';
                if(globalIsAdmin) document.getElementById('side-panel-ui').style.display = 'block';
                iniciarEscuchas();
            }
        });

        function iniciarEscuchas() {
            const hoy = new Date();
            document.getElementById('report-month').value = hoy.getFullYear() + '-' + String(hoy.getMonth() + 1).padStart(2, '0');

            onSnapshot(collection(db, "perfiles"), (snap) => {
                perfilesGlobal = {}; snap.forEach(d => { perfilesGlobal[d.id] = d.data(); });
                const current = perfilesGlobal[auth.currentUser.email.toLowerCase()];
                if(current && current.photo) {
                    const photoEl = document.getElementById('user-photo');
                    photoEl.src = current.photo; photoEl.style.display = 'block';
                    document.getElementById('display-profile-name').innerText = current.displayName || "";
                }
            });

            onSnapshot(collection(db, "psicologas"), (snap) => { 
                equipoGlobal = snap.docs.map(d => ({id: d.id, ...d.data()})); 
                document.getElementById('select-psicologa-cita').innerHTML = equipoGlobal.map(p => `<option value="${p.email.toLowerCase()}">${p.name}</option>`).join('');
                if(globalIsAdmin) recalcularAdmin();
            });

            onSnapshot(collection(db, "citas"), (snap) => { 
                const todas = snap.docs.map(d => ({id: d.id, ...d.data()})); 
                citasGlobal = globalIsAdmin ? todas : todas.filter(c => c.user === auth.currentUser.email.toLowerCase());
                actualizarCalendario();
            });
        }

        function actualizarCalendario() {
            if(!window.calendarObj) {
                window.calendarObj = new FullCalendar.Calendar(document.getElementById('calendar'), {
                    initialView: 'dayGridMonth',
                    locale: 'es',
                    firstDay: 1,
                    headerToolbar: { left: 'prev,next', center: 'title', right: 'dayGridMonth,timeGridDay' },
                    selectable: true,
                    dateClick: (info) => {
                        document.querySelectorAll('.fc-daygrid-day').forEach(el => el.classList.remove('fc-day-selected'));
                        info.dayEl.classList.add('fc-day-selected');
                        renderAgendaDia(info.dateStr);
                    },
                    eventClick: (info) => abrirModalCita(info.event.id),
                    height: 'auto'
                });
                window.calendarObj.render();
            }
            window.calendarObj.removeAllEvents();
            const filtradas = filtroEspecialista ? citasGlobal.filter(c => c.user === filtroEspecialista) : citasGlobal;
            filtradas.forEach(c => window.calendarObj.addEvent({ id: c.id, title: c.title, start: c.start, color: c.color }));
        }

        window.renderAgendaDia = (fecha) => {
            const list = document.getElementById('agenda-list');
            const filtradas = (filtroEspecialista ? citasGlobal.filter(c => c.user === filtroEspecialista) : citasGlobal)
                                .filter(c => c.start.startsWith(fecha))
                                .sort((a,b) => a.start.localeCompare(b.start));
            
            document.getElementById('agenda-viewer').style.display = 'block';
            document.getElementById('agenda-title').innerText = "Citas: " + fecha.split('-').reverse().join('/');
            
            list.innerHTML = filtradas.length ? filtradas.map(c => `
                <div class="event-ios-card" onclick="abrirModalCita('${c.id}')">
                    <div class="event-time">${c.start.split('T')[1].substring(0,5)}</div>
                    <div class="event-bar" style="background:${c.color}"></div>
                    <div style="flex:1;">
                        <div class="event-info-title">${c.title}</div>
                        <div class="event-info-sub">${c.user}</div>
                    </div>
                </div>`).join('') : '<p style="text-align:center; opacity:0.3; padding:20px;">Sin sesiones hoy</p>';
        };

        window.filtrarPorEspecialista = (email) => {
            filtroEspecialista = email;
            document.getElementById('btn-reset-filter').style.display = email ? 'block' : 'none';
            recalcularAdmin();
            actualizarCalendario();
        };

        window.abrirModalCita = (id = null) => {
            citaSeleccionadaId = id;
            if(id) {
                const c = citasGlobal.find(x => x.id === id);
                document.getElementById('px-nombre').value = c.title;
                document.getElementById('px-whatsapp').value = c.tel || "";
                document.getElementById('px-start').value = c.start.substring(0, 16);
                document.getElementById('select-psicologa-cita').value = c.user;
                document.getElementById('wpp-actions').style.display = 'flex';
                document.getElementById('btn-eliminar-cita').style.display = 'block';
            } else {
                document.getElementById('px-nombre').value = "";
                document.getElementById('px-whatsapp').value = "";
                document.getElementById('wpp-actions').style.display = 'none';
                document.getElementById('btn-eliminar-cita').style.display = 'none';
            }
            document.getElementById('modal-cita').style.display = 'flex';
        };

        window.cerrarModalCita = () => document.getElementById('modal-cita').style.display = 'none';

        document.getElementById('btn-guardar-cita').onclick = async () => {
            const email = document.getElementById('select-psicologa-cita').value;
            const psi = equipoGlobal.find(p => p.email.toLowerCase() === email);
            const data = { 
                title: document.getElementById('px-nombre').value, 
                tel: document.getElementById('px-whatsapp').value, 
                start: document.getElementById('px-start').value, 
                user: email, color: psi ? psi.color : "#ccc" 
            };
            if(citaSeleccionadaId) await updateDoc(doc(db, "citas", citaSeleccionadaId), data);
            else await addDoc(collection(db, "citas"), data);
            cerrarModalCita(); lanzarToast("Cita guardada");
        };

        document.getElementById('btn-eliminar-cita').onclick = async () => {
            if(confirm("¿Eliminar?")) { await deleteDoc(doc(db, "citas", citaSeleccionadaId)); cerrarModalCita(); }
        };

        window.recalcularAdmin = () => {
            const mesSel = document.getElementById('report-month').value;
            const conteo = {};
            citasGlobal.forEach(c => { if(c.start.startsWith(mesSel)) conteo[c.user] = (conteo[c.user] || 0) + 1; });
            document.getElementById('docs-list').innerHTML = equipoGlobal.map(p => {
                const pInfo = perfilesGlobal[p.email.toLowerCase()] || {};
                const activa = filtroEspecialista === p.email.toLowerCase();
                return `
                <div class="doc-item" style="border-color:${p.color}; ${activa ? 'background:#f2f2f7; border-color:#1c1c1e;' : ''}" onclick="filtrarPorEspecialista('${p.email.toLowerCase()}')">
                    <img src="${pInfo.photo || ''}" class="doc-thumb" style="${!pInfo.photo ? 'opacity:0' : ''}">
                    <div class="doc-info">
                        <h4>${p.name}</h4>
                        <p>${conteo[p.email.toLowerCase()] || 0} sesiones</p>
                    </div>
                </div>`;
            }).join('');
        };

        document.getElementById('login-btn').onclick = () => { 
            signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value).catch(() => alert("Error")); 
        };
        document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => location.reload());
        
        document.getElementById('add-doc-btn').onclick = async () => {
            const n = document.getElementById('new-doc-name').value;
            const e = document.getElementById('new-doc-email').value;
            if(n && e) {
                await addDoc(collection(db, "psicologas"), { name: n, email: e.toLowerCase(), color: PALETA[equipoGlobal.length % PALETA.length] });
                document.getElementById('new-doc-name').value = ""; document.getElementById('new-doc-email').value = "";
            }
        };
    </script>
</body>
</html>
